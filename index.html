<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LegionShop | Cosmic</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #02040a;
            --surface: rgba(10, 15, 30, 0.8);
            --text: #ffffff;
            --text-muted: #8ba3c7;
            --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.6);
            --danger: #ff3366;
            --admin-color: #2ecc71;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Exo 2', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 90px;
            overflow-x: hidden;
            position: relative;
        }

        /* ФОН С ЧЕРНОЙ ДЫРОЙ */
        .space-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: url('https://i.pinimg.com/736x/91/11/1f/91111fd5d503d82c3081f0239c16490e.jpg') center/cover no-repeat;
        }
        .space-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at center, rgba(2,4,10,0.4) 0%, rgba(2,4,10,0.95) 100%);
        }

        /* ШАПКА */
        .hero {
            position: relative; height: 100px; display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2); background: rgba(2,4,10,0.5);
        }

        .hero h1 {
            font-size: 28px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase;
            color: var(--primary); text-shadow: 0 0 15px var(--primary-glow);
            font-family: monospace;
        }

        /* НЕОНОВЫЙ ПОИСК */
        .search-container {
            padding: 15px 20px 5px 20px;
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-icon {
            position: absolute;
            left: 35px;
            width: 20px;
            height: 20px;
            fill: var(--primary);
            filter: drop-shadow(0 0 5px var(--primary));
            pointer-events: none;
            z-index: 2;
        }
        .search-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: var(--surface);
            border: 1px solid transparent;
            background: linear-gradient(var(--bg), var(--bg)) padding-box,
                        linear-gradient(45deg, var(--primary), #ffffff, #005a80) border-box;
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
        }
        .search-input:focus {
            box-shadow: 0 0 20px var(--primary-glow);
            background: linear-gradient(var(--bg), var(--bg)) padding-box,
                        linear-gradient(45deg, #005a80, var(--primary), #ffffff) border-box;
        }
        .search-input::placeholder { color: var(--text-muted); }

        .filters { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn { 
            background: var(--surface); 
            border: 1px solid rgba(0,240,255,0.3); 
            color: var(--text-muted); 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 14px; 
            white-space: nowrap; 
            transition: 0.3s; 
            cursor: pointer; 
        }
        .filter-btn.active { 
            background: var(--primary); 
            color: #000; 
            font-weight: 800; 
            box-shadow: 0 0 15px var(--primary-glow); 
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 20px 20px; }

        /* КАРТОЧКА С ПЕРЕЛИВАЮЩИМСЯ КРАЕМ */
        .card { 
            border-radius: 16px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            transition: 0.3s;
            
            border: 2px solid transparent;
            background: linear-gradient(rgba(5, 10, 25, 0.9), rgba(5, 10, 25, 0.9)) padding-box,
                        linear-gradient(135deg, var(--primary), #1e3a8a, #ffffff, var(--primary)) border-box;
            background-size: 300% 300%;
            animation: borderShine 6s linear infinite;
        }
        @keyframes borderShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card:active { transform: scale(0.97); box-shadow: 0 0 25px var(--primary-glow); }
        
        .card-img-wrapper {
            width: 100%; height: 140px; background: #ffffff; 
            display: flex; align-items: center; justify-content: center; 
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            position: relative; overflow: hidden;
        }
        .card-img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
        .card-no-img { width: 40px; height: 40px; fill: var(--primary); opacity: 0.5; filter: drop-shadow(0 0 10px var(--primary)); }

        .badge { 
            position: absolute; top: 10px; left: 10px; 
            background: linear-gradient(90deg, var(--primary), #ffffff); 
            color: #000; padding: 4px 10px; border-radius: 8px; 
            font-size: 10px; font-weight: 900; text-transform: uppercase; 
            box-shadow: 0 0 10px var(--primary-glow); z-index: 2; 
        }

        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.2; text-shadow: 0 0 5px rgba(255,255,255,0.3); }
        .card-stock { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .stock-dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-size: 18px; font-weight: 800; color: var(--primary); text-shadow: 0 0 8px var(--primary-glow); }
        
        .buy-btn { 
            background: transparent; 
            border: 2px solid var(--primary); 
            color: var(--primary); 
            width: 34px; height: 34px; 
            border-radius: 10px; 
            font-size: 20px; font-weight: bold; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: 0.3s; 
            box-shadow: inset 0 0 10px rgba(0,240,255,0.2);
        }
        .buy-btn:active { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        
        .qty-control { display: flex; align-items: center; background: rgba(0, 242, 254, 0.1); border: 1px solid var(--primary); border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 10px rgba(0,240,255,0.2);}
        .qty-btn { background: transparent; border: none; color: var(--primary); width: 28px; height: 32px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .qty-num { color: var(--text); font-weight: 800; font-size: 14px; min-width: 20px; text-align: center; text-shadow: 0 0 5px var(--primary); }

        /* НИЖНЕЕ МЕНЮ */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px; 
            background: rgba(2, 4, 10, 0.95); backdrop-filter: blur(20px); 
            display: flex; justify-content: space-around; align-items: center; 
            border-top: 1px solid rgba(0, 240, 255, 0.3); z-index: 999; 
            padding-bottom: env(safe-area-inset-bottom); 
            box-shadow: 0 -5px 20px rgba(0, 240, 255, 0.1);
        }
        .nav-item { 
            display: flex; justify-content: center; align-items: center; 
            width: 50px; height: 50px; cursor: pointer; position: relative;
            border-radius: 50%; transition: 0.3s; color: var(--text-muted); 
        }
        .nav-item:active { background: rgba(0, 240, 255, 0.1); }
        .nav-item.active { color: var(--primary); }
        .nav-icon-svg { width: 30px; height: 30px; fill: currentColor; transition: 0.3s; }
        .nav-item.active .nav-icon-svg { filter: drop-shadow(0 0 10px var(--primary)); }
        
        .cart-badge { 
            position: absolute; top: 2px; right: 2px; 
            background: var(--danger); color: white; 
            font-size: 10px; font-weight: bold; 
            width: 18px; height: 18px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            display: none; box-shadow: 0 0 10px var(--danger); border: 1px solid #000; 
        }

        .page { display: none; animation: fadeIn 0.4s ease-out; } .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .cart-container { padding: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid rgba(0,240,255,0.3); padding: 15px; border-radius: 16px; margin-bottom: 10px; box-shadow: 0 0 10px rgba(0,240,255,0.1);}
        .checkout-btn { position: fixed; bottom: 90px; left: 20px; right: 20px; background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%); color: #000; padding: 16px; border-radius: 16px; border: none; font-size: 16px; font-weight: 800; text-transform: uppercase; box-shadow: 0 10px 20px var(--primary-glow); cursor: pointer; display: none; }

        .profile-menu-item { background: var(--surface); border: 1px solid rgba(0,240,255,0.2); padding: 16px; border-radius: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .profile-menu-item span { font-size: 15px; font-weight: 600; }
        .profile-menu-item .arrow { color: var(--primary); font-size: 18px; }

        /* Админка */
        .admin-item { display: flex; flex-direction: column; background: var(--surface); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--admin-color); box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);}
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .admin-title { font-size: 14px; font-weight: 600; }
        .admin-controls { display: flex; align-items: center; gap: 10px; }
        .admin-btn { background: var(--surface); border: 1px solid var(--admin-color); color: var(--admin-color); width: 30px; height: 30px; border-radius: 8px; font-size: 18px; cursor: pointer; box-shadow: inset 0 0 5px rgba(46, 204, 113, 0.2);}
        .admin-input { width: 50px; text-align: center; background: transparent; border: 1px solid var(--admin-color); color: white; border-radius: 8px; font-size: 16px; font-weight: bold; }
        
        .export-btn { width: 100%; background: var(--admin-color); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 16px; box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);}
        #export-textarea { width: 100%; height: 150px; background: #000; color: var(--admin-color); border: 1px solid var(--admin-color); margin-top: 10px; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; display: none; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(0, 242, 254, 0.9); color: #000; padding: 12px 24px; border-radius: 30px; font-weight: 800; font-size: 14px; transition: 0.4s; z-index: 2000; opacity: 0; pointer-events: none; box-shadow: 0 0 20px var(--primary);}
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Фикс для ПК: ограничиваем ширину карточек */
        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                max-width: 900px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <div class="space-bg"></div>
    <div class="space-overlay"></div>
    
    <div id="toast" class="toast">Добавлено в корзину</div>

    <!-- КАТАЛОГ -->
    <div id="page-catalog" class="page active">
        <div class="hero">
            <h1 id="matrix-text"></h1>
        </div>
        
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Найти девайс..." oninput="handleSearch()">
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterProducts('all', this)">Все товары</button>
            <button class="filter-btn" onclick="filterProducts('pods', this)">Поды</button>
        </div>
        <div class="grid" id="catalog-grid"></div>
    </div>

    <!-- КОРЗИНА -->
    <div id="page-cart" class="page">
        <div class="cart-container">
            <h2 style="margin-bottom: 20px; color: var(--primary); text-shadow: 0 0 10px var(--primary-glow);">КОРЗИНА</h2>
            <div id="cart-items"></div>
            <div id="cart-empty-state" style="text-align:center; margin-top:50px; color:var(--text-muted);"><p>Ваша корзина пуста</p></div>
        </div>
        <button class="checkout-btn" id="checkout-btn" onclick="checkout()">Оформить заказ</button>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="page-profile" class="page">
        <div class="cart-container">
            <!-- Блок с данными пользователя. Добавлены ID для JS -->
            <div style="display:flex; align-items:center; gap:15px; margin-bottom:30px;">
                <div id="user-avatar" style="width:60px; height:60px; background:linear-gradient(135deg, #00f2fe, #4facfe); border-radius:50%; box-shadow: 0 0 20px var(--primary-glow); display:flex; justify-content:center; align-items:center; font-size:24px; font-weight:800; color:#000; background-size:cover; background-position:center;"></div>
                <div>
                    <h3 id="user-name" style="font-size:18px;">Загрузка...</h3>
                    <p id="user-username" style="color:var(--primary); font-size:14px;">@...</p>
                </div>
            </div>
            <div class="profile-menu-item"><div><span>История заказов</span></div><span class="arrow">›</span></div>
            <div class="profile-menu-item"><div><span>Ваши промокоды</span></div><span class="arrow">›</span></div>
            <div class="profile-menu-item" onclick="window.open('https://t.me/managerlegionshop', '_blank')"><div><span>Поддержка</span></div><span class="arrow">›</span></div>
        </div>
    </div>

    <!-- АДМИНКА -->
    <div id="page-admin" class="page">
        <div class="cart-container">
            <h2 style="margin-bottom: 20px; color: var(--admin-color);">АДМИН-ПАНЕЛЬ</h2>
            <div id="admin-list"></div>
            <button class="export-btn" onclick="generateCode()">Сгенерировать код</button>
            <textarea id="export-textarea" readonly></textarea>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="switchTab('catalog')" id="nav-catalog">
            <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
        <div class="nav-item" onclick="switchTab('cart')" id="nav-cart">
            <div style="position:relative;">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <div class="cart-badge" id="cart-badge">0</div>
            </div>
        </div>
        <div class="nav-item" onclick="switchTab('profile')" id="nav-profile">
            <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="nav-item" onclick="switchTab('admin')" id="nav-admin" style="display: none; color: var(--admin-color);">
            <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></svg>
        </div>
    </div>

    <script>
        // --- БЛОК ИНИЦИАЛИЗАЦИИ ПОЛЬЗОВАТЕЛЯ ---
        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        
        function initProfile() {
            const nameEl = document.getElementById('user-name');
            const usernameEl = document.getElementById('user-username');
            const avatarEl = document.getElementById('user-avatar');

            if (tgUser) {
                // Устанавливаем имя
                let fullName = tgUser.first_name || '';
                if (tgUser.last_name) fullName += ' ' + tgUser.last_name;
                nameEl.innerText = fullName;

                // Устанавливаем никнейм (если нет, то ID)
                if (tgUser.username) {
                    usernameEl.innerText = '@' + tgUser.username;
                } else {
                    usernameEl.innerText = '@id' + tgUser.id;
                }

                // Устанавливаем аватарку (если есть)
                if (tgUser.photo_url) {
                    avatarEl.style.backgroundImage = `url('${tgUser.photo_url}')`;
                    avatarEl.innerText = ''; // Убираем букву
                } else {
                    // Если фото нет, ставим первую букву имени
                    avatarEl.innerText = (tgUser.first_name ? tgUser.first_name.charAt(0).toUpperCase() : '?');
                }
            } else {
                // Если зашли не через Telegram (например, с ПК в браузере)
                nameEl.innerText = "Гость";
                usernameEl.innerText = "@no_telegram";
                avatarEl.innerText = "Г";
            }
        }

        // ЭФФЕКТ МАТРИЦЫ
        function runMatrixEffect() {
            const targetText = "LEGION SHOP";
            const chars = "!<>-_\\/[]{}—=+*^?#________01";
            let iteration = 0;
            const el = document.getElementById("matrix-text");
            el.innerText = targetText.split("").map(() => chars[Math.floor(Math.random() * chars.length)]).join("");
            const interval = setInterval(() => {
                el.innerText = targetText.split("").map((letter, index) => {
                    if(index < iteration) return targetText[index];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join("");
                if(iteration >= targetText.length) clearInterval(interval);
                iteration += 1 / 3;
            }, 50);
        }
        runMatrixEffect();
        setInterval(runMatrixEffect, 14000);

        // Проверка на админа
        const ADMIN_USERNAME = 'managerlegionshop'; 
        if (tgUser && tgUser.username === ADMIN_USERNAME) {
            document.getElementById('nav-admin').style.display = 'flex';
        }

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
            window.Telegram.WebApp.setHeaderColor('#02040a');
        }

        // МАССИВ ТОВАРОВ С ВСЕМИ ЦВЕТАМИ И ЛИМИТОМ
        let products = [
            // XROS 6 MINI
            { id: 1, title: "XROS 6 Mini Black", desc: "Цвет: Черный", stock: 5, maxLimit: 5, price: 1800, category: "pods", badge: "ХИТ", img: "xros6mini.jpg" },
            { id: 2, title: "XROS 6 Mini Jelly Blue", desc: "Цвет: Голубой", stock: 0, maxLimit: 5, price: 1800, category: "pods", badge: "", img: "xros6mini.jpg" },
            { id: 3, title: "XROS 6 Mini Plume Pink", desc: "Цвет: Розовый", stock: 0, maxLimit: 5, price: 1800, category: "pods", badge: "", img: "xros6mini.jpg" },
            
            // XROS 6
            { id: 4, title: "XROS 6 Cosmic Black", desc: "Цвет: Космический черный", stock: 4, maxLimit: 5, price: 2500, category: "pods", badge: "NEW", img: "xros6.jpg" },
            { id: 5, title: "XROS 6 Abyssal Blue", desc: "Цвет: Глубокий синий", stock: 0, maxLimit: 5, price: 2500, category: "pods", badge: "", img: "xros6.jpg" },
            { id: 6, title: "XROS 6 Slate Black", desc: "Цвет: Аспидный черный", stock: 0, maxLimit: 5, price: 2500, category: "pods", badge: "", img: "xros6.jpg" },
            { id: 7, title: "XROS 6 Carbon Fiber Gray", desc: "Цвет: Карбон", stock: 0, maxLimit: 5, price: 2500, category: "pods", badge: "", img: "xros6.jpg" },
            { id: 8, title: "XROS 6 Silk Green", desc: "Цвет: Шелковый зеленый", stock: 0, maxLimit: 5, price: 2500, category: "pods", badge: "", img: "xros6.jpg" },
            { id: 9, title: "XROS 6 Silk Gray", desc: "Цвет: Шелковый серый", stock: 0, maxLimit: 5, price: 2500, category: "pods", badge: "", img: "xros6.jpg" }
        ];

        let cart = [];
        let activeCategory = 'all'; 
        let searchQuery = ''; 

        try { cart = JSON.parse(localStorage.getItem('legion_cart_cosmic')) || []; } catch(e) {}

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderProducts();
        }

        function filterProducts(category, btnElement) {
            activeCategory = category; 
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('catalog-grid');
            
            let filtered = products.filter(p => p.stock > 0);
            if (activeCategory !== 'all') {
                filtered = filtered.filter(p => p.category === activeCategory);
            }
            if (searchQuery !== '') {
                filtered = filtered.filter(p => p.title.toLowerCase().includes(searchQuery));
            }
            
            grid.innerHTML = filtered.map(p => {
                const cartItem = cart.find(item => item.id === p.id);
                const qty = cartItem ? cartItem.qty : 0;
                
                let actionHTML = qty === 0 
                    ? `<button class="buy-btn" onclick="changeQty(${p.id}, 1)">+</button>`
                    : `<div class="qty-control"><button class="qty-btn" onclick="changeQty(${p.id}, -1)">-</button><span class="qty-num">${qty}</span><button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button></div>`;

                let imgHTML = '';
                if (p.img && p.img.trim() !== "") {
                    imgHTML = `
                        <img src="${p.img}" class="card-img" alt="${p.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <svg class="card-no-img" style="display:none;" viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-2 12H8V8h8v8z"/></svg>
                    `;
                } else {
                    imgHTML = `<svg class="card-no-img" viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-2 12H8V8h8v8z"/></svg>`;
                }

                let infoHTML = `<div class="card-stock"><div class="stock-dot"></div> В наличии (${p.stock})</div>`;

                return `
                <div class="card">
                    <div class="card-img-wrapper">
                        ${imgHTML}
                        ${p.badge ? `<div class="badge">${p.badge}</div>` : ''}
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="card-title">${p.title}</div>
                            <div style="font-size:10px; color:var(--primary); margin-bottom:4px; line-height:1.1;">${p.desc}</div>
                            ${infoHTML}
                        </div>
                        <div class="card-footer">
                            <div class="price">${p.price} ₽</div>
                            ${actionHTML}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function changeQty(id, delta) {
            const existing = cart.find(item => item.id === id);
            const product = products.find(p => p.id === id);
            
            if (existing) {
                if (delta > 0 && existing.qty >= product.stock) return;
                
                if (delta > 0 && existing.qty >= product.maxLimit) {
                    alert(`Максимум ${product.maxLimit} шт. в одни руки!`);
                    return;
                }
                
                existing.qty += delta;
                if (existing.qty <= 0) cart = cart.filter(item => item.id !== id); 
            } else if (delta > 0) {
                cart.push({ ...product, qty: 1 });
            }
            
            if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            saveCart(); updateBadge(); renderProducts(); 
        }

        function saveCart() { try { localStorage.setItem('legion_cart_cosmic', JSON.stringify(cart)); } catch(e) {} }
        
        function updateBadge() {
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('cart-badge');
            if (total > 0) { badge.style.display = 'flex'; badge.innerText = total; }
            else { badge.style.display = 'none'; }
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const emptyState = document.getElementById('cart-empty-state');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            if (cart.length === 0) { container.innerHTML = ''; emptyState.style.display = 'block'; checkoutBtn.style.display = 'none'; return; }
            emptyState.style.display = 'none'; checkoutBtn.style.display = 'block';
            
            let total = 0;
            container.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `<div class="cart-item"><div><div style="font-weight: 600; font-size: 15px;">${item.title}</div><div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${item.qty} шт.</div></div><div style="font-weight:800; font-size:16px; color:var(--primary); text-shadow: 0 0 5px var(--primary);">${item.price * item.qty} ₽</div></div>`;
            }).join('') + `<div style="margin-top:20px; font-size:20px; font-weight:800; display:flex; justify-content:space-between; border-top: 1px solid var(--surface-border); padding-top: 15px;"><span>Итого:</span> <span style="color:var(--primary); text-shadow: 0 0 5px var(--primary);">${total} ₽</span></div>`;
        }

        // === АДМИНКА ===
        function renderAdminPanel() {
            const list = document.getElementById('admin-list');
            list.innerHTML = products.map(p => {
                return `
                <div class="admin-item">
                    <div class="admin-header">
                        <div class="admin-title">${p.title}</div>
                        <div class="admin-controls">
                            <button class="admin-btn" onclick="updateStock(${p.id}, -1)">-</button>
                            <input type="number" class="admin-input" value="${p.stock}" onchange="setStock(${p.id}, this.value)">
                            <button class="admin-btn" onclick="updateStock(${p.id}, 1)">+</button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function updateStock(id, delta) {
            const p = products.find(p => p.id === id);
            p.stock += delta;
            if(p.stock < 0) p.stock = 0;
            renderAdminPanel();
        }

        function setStock(id, val) {
            const p = products.find(p => p.id === id);
            p.stock = parseInt(val) || 0;
            if(p.stock < 0) p.stock = 0;
            renderAdminPanel();
        }

        function generateCode() {
            const textarea = document.getElementById('export-textarea');
            textarea.value = "let products = " + JSON.stringify(products, null, 4) + ";";
            textarea.style.display = 'block';
            textarea.select();
            document.execCommand('copy');
            alert("Код скопирован! Вставь его в index.html вместо старого 'let products = [...]'");
        }

        function switchTab(tabId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(`page-${tabId}`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');
            
            if (tabId === 'cart') renderCart();
            if (tabId === 'admin') renderAdminPanel();
        }

        function checkout() {
            if (cart.length === 0) return;
            
            let orderText = "🛒 Новый заказ из приложения:\n\n";
            let total = 0;
            
            cart.forEach((item, index) => {
                orderText += `${index + 1}. ${item.title} — ${item.qty} шт. (${item.price * item.qty} ₽)\n`;
                total += item.price * item.qty;
            });
            
            orderText += `\n💰 Итого к оплате: ${total} ₽`;
            
            // Добавляем инфу о том, кто сделал заказ (если данные ТГ подтянулись)
            if (tgUser) {
                orderText += `\n\n👤 Заказчик: ${tgUser.first_name} ${tgUser.last_name || ''}`;
                if (tgUser.username) orderText += ` (@${tgUser.username})`;
            }
            
            cart = [];
            saveCart(); updateBadge(); renderProducts(); switchTab('catalog');
            const managerUsername = 'managerlegionshop';
            const encodedText = encodeURIComponent(orderText);
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openTelegramLink(`https://t.me/${managerUsername}?text=${encodedText}`);
            } else {
                window.open(`https://t.me/${managerUsername}?text=${encodedText}`, '_blank');
            }
        }

        // Запускаем инициализацию профиля и отрисовку товаров
        initProfile();
        renderProducts(); 
        updateBadge();
    </script>
</body>
</html>
