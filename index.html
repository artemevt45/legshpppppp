<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LegionShop | Cosmic</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* БАЗОВАЯ ТЕМА (Сине-голубая) */
        :root, body[data-theme="base"] {
            --bg: #02040a;
            --surface: rgba(10, 15, 30, 0.85);
            --surface-solid: #0a0f1e;
            --text: #ffffff;
            --text-muted: #a0b8d6;
            --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.6);
            --danger: #ff3366;
            --admin-color: #2ecc71;
            --nav-bg: rgba(2, 4, 10, 0.95);
            --bg-image: url('bazatema.jpg');
            --modal-bg: #0d1425;
        }

        /* ТЕМНАЯ ТЕМА */
        body[data-theme="dark"] {
            --bg: #000000;
            --surface: rgba(20, 20, 20, 0.85);
            --surface-solid: #141414;
            --text: #ffffff;
            --text-muted: #aaaaaa;
            --primary: #ffffff;
            --primary-glow: rgba(255, 255, 255, 0.6);
            --nav-bg: rgba(0, 0, 0, 0.95);
            --bg-image: url('blacktema.jpg');
            --modal-bg: #111111;
        }

        /* СВЕТЛАЯ ТЕМА */
        body[data-theme="light"] {
            --bg: #f0f2f5;
            --surface: rgba(255, 255, 255, 0.95);
            --surface-solid: #ffffff;
            --text: #111111;
            --text-muted: #444444;
            --primary: #007aff;
            --primary-glow: rgba(0, 122, 255, 0.4);
            --nav-bg: rgba(255, 255, 255, 0.95);
            --bg-image: url('whitetema.jpg');
            --modal-bg: #ffffff;
        }

        /* КРАСНАЯ ТЕМА */
        body[data-theme="red"] {
            --bg: #0a0000;
            --surface: rgba(40, 0, 0, 0.85);
            --surface-solid: #2b0000;
            --text: #ffffff;
            --text-muted: #e0a0a0;
            --primary: #d32f2f;
            --primary-glow: rgba(211, 47, 47, 0.6);
            --nav-bg: rgba(10, 0, 0, 0.95);
            --bg-image: url('redtema.jpg');
            --modal-bg: #2a0505;
        }

        /* СЕРАЯ ТЕМА */
        body[data-theme="gray"] {
            --bg: #1a1a1a;
            --surface: rgba(40, 40, 40, 0.85);
            --surface-solid: #282828;
            --text: #ffffff;
            --text-muted: #bbbbbb;
            --primary: #b0bec5; 
            --primary-glow: rgba(176, 190, 197, 0.6);
            --nav-bg: rgba(26, 26, 26, 0.95);
            --bg-image: url('https://i.pinimg.com/736x/91/11/1f/91111fd5d503d82c3081f0239c16490e.jpg');
            --modal-bg: #222222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Exo 2', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 90px;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }

        .space-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: var(--bg-image) center/cover no-repeat; opacity: 1; transition: background 0.3s; }
        .space-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, transparent 0%, var(--bg) 100%); transition: background 0.3s; }

        .hero { position: relative; height: 100px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(128, 128, 128, 0.2); background: rgba(0,0,0,0.1); }
        .hero h1 { font-size: 38px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); display: flex; gap: 2px; }
        .hero h1 span { display: inline-block; opacity: 0; transform: translateY(-30px); animation: pianoDrop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes pianoDrop { to { opacity: 1; transform: translateY(0); } }

        /* ПОИСК И ФИЛЬТРЫ */
        .search-container { padding: 15px 20px 5px 20px; position: relative; display: flex; align-items: center; }
        .search-icon { position: absolute; left: 35px; width: 20px; height: 20px; fill: var(--primary); filter: drop-shadow(0 0 5px var(--primary)); pointer-events: none; z-index: 2; }
        .search-input { width: 100%; padding: 12px 15px 12px 45px; background: var(--surface); border: 1px solid transparent; background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(45deg, var(--primary), #ffffff, var(--primary)) border-box; border-radius: 12px; color: var(--text); font-size: 14px; outline: none; transition: 0.3s; box-shadow: 0 0 15px var(--primary-glow); }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { box-shadow: 0 0 25px var(--primary-glow); }

        /* Категории */
        .filters-wrapper { padding: 15px 20px 5px 20px; }
        .filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        
        .filter-btn { background: var(--surface); border: 1px solid var(--primary-glow); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 14px; white-space: nowrap; transition: 0.3s; cursor: pointer; }
        .filter-btn.active { background: var(--primary); color: var(--bg); font-weight: 800; box-shadow: 0 0 15px var(--primary-glow); }

        /* Кнопка "Фильтры" */
        .filter-trigger-container { padding: 5px 20px 15px 20px; display: flex; justify-content: flex-start; }
        .open-filter-btn { 
            background: var(--surface); border: 1px solid var(--primary-glow); 
            color: var(--text); padding: 6px 16px; border-radius: 12px; 
            font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: 0.3s; font-weight: 600;
        }
        .open-filter-btn:active { background: var(--primary); color: var(--bg); }

        /* МОДАЛЬНОЕ ОКНО ФИЛЬТРОВ */
        #filter-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s;
        }
        #filter-modal.active { display: flex; opacity: 1; }
        
        .filter-content {
            background: var(--modal-bg); width: 85%; max-width: 360px; border-radius: 20px;
            padding: 20px; border: 1px solid var(--primary-glow); box-shadow: 0 0 30px var(--primary-glow);
            transform: translateY(20px); transition: transform 0.3s;
            max-height: 75vh; overflow-y: auto;
        }
        #filter-modal.active .filter-content { transform: translateY(0); }

        .filter-content h3 { font-size: 16px; margin-bottom: 15px; color: var(--primary); text-align: center; }
        .filter-group { margin-bottom: 20px; }
        .filter-group-title { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;}
        
        .radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .radio-label {
            display: flex; align-items: center; padding: 8px 12px;
            background: var(--surface-solid); border-radius: 10px; border: 1px solid transparent;
            cursor: pointer; transition: 0.2s; font-size: 13px;
        }
        .radio-label:active { background: rgba(128, 128, 128, 0.2); }
        .radio-label input[type="radio"] { display: none; }
        .radio-custom {
            width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text-muted);
            margin-right: 8px; display: flex; justify-content: center; align-items: center;
            transition: 0.2s;
        }
        .radio-label input[type="radio"]:checked + .radio-custom {
            border-color: var(--primary);
        }
        .radio-label input[type="radio"]:checked + .radio-custom::after {
            content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--primary);
            box-shadow: 0 0 8px var(--primary);
        }
        .radio-label input[type="radio"]:checked ~ span { color: var(--primary); font-weight: 600; }

        .apply-btn {
            width: 100%; background: var(--primary); color: var(--bg); border: none;
            padding: 12px; border-radius: 12px; font-weight: 800; font-size: 15px;
            cursor: pointer; box-shadow: 0 0 15px var(--primary-glow); text-transform: uppercase;
        }
        .apply-btn:active { transform: scale(0.95); }

        /* СЕТКА И КАРТОЧКИ */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 20px 20px; align-items: start; }
        .card { border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: all 0.3s ease; border: 2px solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(135deg, var(--primary), var(--bg), var(--primary)) border-box; background-size: 300% 300%; animation: borderShine 6s linear infinite; }
        @keyframes borderShine { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .card:hover, .card:active { transform: scale(0.98) translateY(-2px); box-shadow: 0 0 25px var(--primary-glow), inset 0 0 15px var(--primary-glow); border-color: var(--primary); }
        
        .card-img-wrapper { width: 100%; height: 170px; background: #ffffff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(128, 128, 128, 0.2); position: relative; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: contain; padding: 5px; transition: transform 0.3s; }
        .card:hover .card-img { transform: scale(1.05); }
        
        .card-no-img { width: 40px; height: 40px; fill: var(--primary); opacity: 0.5; filter: drop-shadow(0 0 10px var(--primary)); }
        .badge { position: absolute; top: 10px; left: 10px; background: linear-gradient(90deg, var(--primary), #ffffff); color: #000; padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 900; text-transform: uppercase; z-index: 2; animation: badgePulse 2s infinite alternate; }
        @keyframes badgePulse { 0% { box-shadow: 0 0 5px var(--primary-glow); transform: scale(1); } 100% { box-shadow: 0 0 20px var(--primary), 0 0 10px var(--primary); transform: scale(1.05); } }

        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.2; color: var(--text); }
        .card-stock { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .stock-dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-size: 18px; font-weight: 800; color: var(--primary); text-shadow: 0 0 8px var(--primary-glow); }
        
        .buy-btn { background: rgba(128, 128, 128, 0.1); border: 2px solid var(--primary); color: var(--primary); width: 36px; height: 36px; border-radius: 10px; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px var(--primary-glow); padding-bottom: 3px; line-height: 1; }
        .buy-btn:active { background: var(--primary); color: var(--bg); box-shadow: 0 0 25px var(--primary); }
        
        .qty-control { display: flex; align-items: center; background: rgba(128, 128, 128, 0.1); border: 1px solid var(--primary); border-radius: 10px; overflow: hidden; }
        .qty-btn { background: transparent; border: none; color: var(--primary); width: 28px; height: 32px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .qty-num { color: var(--text); font-weight: 800; font-size: 14px; min-width: 20px; text-align: center; }

        /* Компактная кнопка выбора */
        .choose-flavor-btn { 
            background: rgba(0, 242, 254, 0.1); color: var(--primary); 
            border: 1px solid var(--primary); padding: 6px 12px; border-radius: 8px; 
            font-weight: 700; font-size: 11px; margin-top: 8px; cursor: pointer; 
            text-transform: uppercase; transition: 0.3s; width: auto; align-self: flex-start;
        }
        .choose-flavor-btn:active { background: var(--primary); color: var(--bg); }
        
        .variants-container { display: none; flex-direction: column; gap: 8px; margin-top: 10px; border-top: 1px solid rgba(128, 128, 128, 0.2); padding-top: 10px; width: 100%;}
        .variant-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface-solid); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(128, 128, 128, 0.2); }
        
        .glossy-stock-box { background: linear-gradient(135deg, #ffffff, #c0c0c0, #ffffff); color: #000; font-weight: 900; font-size: 12px; padding: 2px 6px; border-radius: 4px; box-shadow: 0 0 8px rgba(255, 255, 255, 0.6); min-width: 22px; text-align: center; margin-right: 8px; }
        .variant-name { font-size: 11px; color: var(--text); flex-grow: 1; }
        
        .variant-item .qty-control { height: 28px; }
        .variant-item .qty-btn { height: 28px; width: 24px; font-size: 16px; }
        .variant-item .qty-num { font-size: 12px; }
        .variant-item .buy-btn { height: 28px; width: 28px; font-size: 18px; border-radius: 8px; padding-bottom: 2px;}

        /* НИЖНЕЕ МЕНЮ */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--nav-bg); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--primary-glow); z-index: 999; padding-bottom: env(safe-area-inset-bottom); transition: background 0.3s; }
        .nav-item { display: flex; justify-content: center; align-items: center; width: 50px; height: 50px; cursor: pointer; position: relative; border-radius: 50%; transition: 0.3s; color: var(--text-muted); }
        .nav-item.active { color: var(--primary); }
        .nav-icon-svg { width: 30px; height: 30px; fill: currentColor; transition: 0.3s; }
        .nav-item.active .nav-icon-svg { filter: drop-shadow(0 0 10px var(--primary)); }
        
        .cart-badge { position: absolute; top: 2px; right: 2px; background: var(--danger); color: white; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; display: none; box-shadow: 0 0 10px var(--danger); border: 1px solid #000; }

        .page { display: none; animation: fadeIn 0.4s ease-out; } .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* КОРЗИНА */
        .cart-container { padding: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--primary-glow); padding: 15px; border-radius: 16px; margin-bottom: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);}
        
        .remove-btn { background: transparent; border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; margin-left: 10px; }
        .remove-btn:hover, .remove-btn:active { background: var(--danger); color: #fff; box-shadow: 0 0 10px var(--danger); }

        .upsell-banner { background: linear-gradient(135deg, rgba(0,242,254,0.1), rgba(0,0,0,0.5)); border: 1px dashed var(--primary); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
        .upsell-text div:first-child { font-weight: bold; font-size: 14px; color: var(--primary); margin-bottom: 2px;}
        .upsell-text div:last-child { font-size: 12px; color: var(--text); }
        .upsell-btn { background: var(--primary); color: var(--bg); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px var(--primary-glow); }

        #cart-empty-state { text-align: center; margin-top: 50px; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pug-img { width: 180px; height: 180px; margin-bottom: 20px; filter: drop-shadow(0 0 25px var(--primary-glow)); animation: floatPug 3s ease-in-out infinite; border-radius: 20px; object-fit: contain; }
        @keyframes floatPug { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .empty-cart-text { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: var(--text); }
        .go-catalog-btn { background: var(--primary); color: var(--bg); border: none; padding: 12px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 0 15px var(--primary-glow); transition: 0.3s; text-transform: uppercase; }
        .go-catalog-btn:active { transform: scale(0.95); }

        @keyframes breathe {
            0% { box-shadow: 0 0 10px var(--primary-glow); transform: scale(1); }
            50% { box-shadow: 0 0 25px var(--primary), 0 0 40px var(--primary-glow); transform: scale(1.02); }
            100% { box-shadow: 0 0 10px var(--primary-glow); transform: scale(1); }
        }
        .checkout-btn { position: fixed; bottom: 90px; left: 20px; right: 20px; background: linear-gradient(90deg, var(--primary) 0%, var(--primary-glow) 100%); color: var(--bg); padding: 16px 20px; border-radius: 16px; border: none; font-size: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer; display: none; justify-content: space-between; align-items: center; animation: breathe 2s infinite ease-in-out; }

        .profile-menu-item { background: var(--surface); border: 1px solid var(--primary-glow); padding: 16px; border-radius: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--text); }
        .profile-menu-item span { font-size: 15px; font-weight: 600; }
        .profile-menu-item .arrow { color: var(--primary); font-size: 18px; }

        .admin-item { display: flex; flex-direction: column; background: var(--surface); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--admin-color); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid rgba(46, 204, 113, 0.3); padding-bottom: 8px;}
        .admin-title { font-size: 14px; font-weight: 600; color: var(--text); }
        .admin-controls { display: flex; align-items: center; gap: 10px; }
        .admin-btn { background: var(--surface); border: 1px solid var(--admin-color); color: var(--admin-color); width: 30px; height: 30px; border-radius: 8px; font-size: 18px; cursor: pointer; }
        .admin-input { width: 50px; text-align: center; background: transparent; border: 1px solid var(--admin-color); color: var(--text); border-radius: 8px; font-size: 16px; font-weight: bold; }
        .admin-variant-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; padding: 5px; background: var(--bg); border-radius: 6px; }
        .admin-variant-title { font-size: 12px; color: var(--text-muted); flex-grow: 1; }
        .add-variant-btn { width: 100%; background: rgba(46, 204, 113, 0.1); color: var(--admin-color); border: 1px dashed var(--admin-color); padding: 8px; border-radius: 8px; font-weight: bold; font-size: 12px; margin-top: 5px; cursor: pointer; }

        .export-btn { width: 100%; background: var(--admin-color); color: var(--bg); border: none; padding: 15px; border-radius: 12px; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 16px; }
        #export-textarea { width: 100%; height: 150px; background: #000; color: var(--admin-color); border: 1px solid var(--admin-color); margin-top: 10px; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; display: none; }

        .theme-btn { flex: 1; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; border: 1px solid transparent; transition: 0.2s; font-family: 'Exo 2', sans-serif;}
        .theme-btn:active { transform: scale(0.95); }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); max-width: 900px; margin: 0 auto; }
        }
    </style>
</head>
<body>

    <div class="space-bg"></div>
    <div class="space-overlay"></div>

    <!-- МОДАЛЬНОЕ ОКНО ФИЛЬТРОВ -->
    <div id="filter-modal">
        <div class="filter-content">
            <h3>Фильтры</h3>
            
            <div class="filter-group">
                <div class="filter-group-title">Сортировка</div>
                <div class="radio-grid">
                    <label class="radio-label">
                        <input type="radio" name="sort" value="default" checked onchange="setSort('default')">
                        <div class="radio-custom"></div> <span>По умолч.</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="sort" value="cheap" onchange="setSort('cheap')">
                        <div class="radio-custom"></div> <span>Дешевле</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="sort" value="expensive" onchange="setSort('expensive')">
                        <div class="radio-custom"></div> <span>Дороже</span>
                    </label>
                </div>
            </div>

            <!-- Фильтр по Бренду (для подов) -->
            <div class="filter-group" id="brand-section" style="display: none;">
                <div class="filter-group-title">Бренд</div>
                <div class="radio-grid">
                    <label class="radio-label">
                        <input type="radio" name="brand" value="all" checked onchange="setBrand('all')">
                        <div class="radio-custom"></div> <span>Все</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="brand" value="Vaporesso" onchange="setBrand('Vaporesso')">
                        <div class="radio-custom"></div> <span>Vaporesso</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="brand" value="Smoant" onchange="setBrand('Smoant')">
                        <div class="radio-custom"></div> <span>Smoant</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="brand" value="Geekvape" onchange="setBrand('Geekvape')">
                        <div class="radio-custom"></div> <span>Geekvape</span>
                    </label>
                </div>
            </div>

            <!-- Фильтр по МГ (для жиж) -->
            <div class="filter-group" id="mg-section" style="display: none;">
                <div class="filter-group-title">Крепость (мг)</div>
                <div class="radio-grid">
                    <label class="radio-label">
                        <input type="radio" name="mg" value="0" checked onchange="setMg(0)">

                variants: [

                    { name: "Энергетик гранат", stock: 1 },

                    { name: "Кислое яблоко ежевика", stock: 1 }
                ]
            }
        ];

        let cart = [];
        try { 
            cart = JSON.parse(localStorage.getItem('legion_cart_cosmic')) || []; 
            cart.forEach(item => {
                const p = products.find(prod => prod.id === item.id);
                if (p) item.price = p.price;
            });
        } catch(e) {}

        let activeCategory = 'all'; 
        let searchQuery = ''; 
        let openAccordions = {}; 
        let currentSort = 'default';
        let currentMg = 0;
        let currentBrand = 'all';

        function openFilters() {
            const modal = document.getElementById('filter-modal');
            document.getElementById('mg-section').style.display = (activeCategory === 'liquids') ? 'block' : 'none';
            document.getElementById('brand-section').style.display = (activeCategory === 'pods') ? 'block' : 'none';
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeFilters() {
            const modal = document.getElementById('filter-modal');
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
            renderProducts();
        }

        function setSort(sortType) {
            currentSort = sortType;
        }

        function setMg(mg) {
            currentMg = parseInt(mg);
        }

        function setBrand(brand) {
            currentBrand = brand;
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderProducts();
        }

        function filterProducts(category, btnElement) {
            activeCategory = category; 
            document.querySelectorAll('.filters .filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderProducts();
        }

        function toggleVariants(productId) {
            openAccordions[productId] = !openAccordions[productId];
            const container = document.getElementById(`variants-${productId}`);
            if (container) {
                container.style.display = openAccordions[productId] ? 'flex' : 'none';
            }
        }

        function renderProducts() {
            const grid = document.getElementById('catalog-grid');
            
            let filtered = products.filter(p => {
                if (p.variants) {
                    if (!p.variants.some(v => v.stock > 0)) return false;
                } else {
                    if (p.stock <= 0) return false;
                }

                if (activeCategory !== 'all' && p.category !== activeCategory) return false;
                if (activeCategory === 'liquids' && currentMg > 0 && p.mg !== currentMg) return false;
                if (activeCategory === 'pods' && currentBrand !== 'all' && p.brand !== currentBrand) return false;

                if (searchQuery !== '') {
                    let matchTitle = p.title.toLowerCase().includes(searchQuery);
                    let matchVariant = p.variants && p.variants.some(v => v.name.toLowerCase().includes(searchQuery));
                    if (!matchTitle && !matchVariant) return false;
                }

                return true;
            });

            if (currentSort === 'cheap') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (currentSort === 'expensive') {
                filtered.sort((a, b) => b.price - a.price);
            }
            
            grid.innerHTML = filtered.map(p => {
                let hasVariants = p.variants && p.variants.length > 0;
                let isLiquid = p.category === 'liquids';
                
                let imgHTML = '';
                if (p.img && p.img.trim() !== "") {
                    imgHTML = `
                        <img src="${p.img}" class="card-img" alt="${p.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <svg class="card-no-img" style="display:none;" viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-2 12H8V8h8v8z"/></svg>
                    `;
                } else {
                    imgHTML = `<svg class="card-no-img" viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-2 12H8V8h8v8z"/></svg>`;
                }

                let variantsHTML = '';
                if (hasVariants) {
                    let forceOpen = searchQuery !== '' && p.variants.some(v => v.name.toLowerCase().includes(searchQuery));

                    let variantsList = p.variants.map(v => {
                        if (v.stock <= 0) return ''; 
                        if (searchQuery !== '' && !p.title.toLowerCase().includes(searchQuery) && !v.name.toLowerCase().includes(searchQuery)) return '';

                        let cartId = `${p.id}_${v.name}`;
                        let cartItem = cart.find(item => item.cartId === cartId);
                        let qty = cartItem ? cartItem.qty : 0;

                        let actionHTML = qty === 0 
                            ? `<button class="buy-btn" onclick="changeQty('${cartId}', 1, ${p.id}, '${v.name}')">+</button>`
                            : `<div class="qty-control"><button class="qty-btn" onclick="changeQty('${cartId}', -1, ${p.id}, '${v.name}')">-</button><span class="qty-num">${qty}</span><button class="qty-btn" onclick="changeQty('${cartId}', 1, ${p.id}, '${v.name}')">+</button></div>`;

                        return `
                            <div class="variant-item">
                                <div style="display: flex; align-items: center; flex-grow: 1;">
                                    <div class="glossy-stock-box">${v.stock}</div>
                                    <div class="variant-name">${v.name}</div>
                                </div>
                                ${actionHTML}
                            </div>
                        `;
                    }).join('');
                    
                    let btnText = isLiquid ? "Выбрать вкус" : "Выбрать цвет";
                    let isOpen = openAccordions[p.id] || forceOpen;
                    
                    variantsHTML = `
                        <button class="choose-flavor-btn" onclick="toggleVariants(${p.id})">${btnText}</button>
                        <div id="variants-${p.id}" class="variants-container" style="display: ${isOpen ? 'flex' : 'none'};">
                            ${variantsList}
                        </div>
                    `;
                } else {
                    const cartItem = cart.find(item => item.id === p.id);
                    const qty = cartItem ? cartItem.qty : 0;
                    variantsHTML = qty === 0 
                        ? `<button class="buy-btn" onclick="changeQty(${p.id}, 1, ${p.id})">+</button>`
                        : `<div class="qty-control"><button class="qty-btn" onclick="changeQty(${p.id}, -1, ${p.id})">-</button><span class="qty-num">${qty}</span><button class="qty-btn" onclick="changeQty(${p.id}, 1, ${p.id})">+</button></div>`;
                }

                let infoHTML = hasVariants 
                    ? `<div class="card-stock"><div class="stock-dot"></div> В наличии</div>` 
                    : `<div class="card-stock"><div class="stock-dot"></div> В наличии (${p.stock})</div>`;

                return `
                <div class="card">
                    <div class="card-img-wrapper">
                        ${imgHTML}
                        ${p.badge ? `<div class="badge">${p.badge}</div>` : ''}
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="card-title">${p.title}</div>
                            <div style="font-size:10px; color:var(--primary); margin-bottom:4px; line-height:1.1;">${p.desc}</div>
                            ${infoHTML}
                        </div>
                        <div class="card-footer" style="${hasVariants ? 'flex-direction: column; align-items: flex-start;' : ''}">
                            <div class="price" style="${hasVariants ? 'margin-bottom: 5px;' : ''}">${p.price} ₽</div>
                            ${variantsHTML}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function changeQty(cartId, delta, productId, variantName) {
            if (!productId) productId = cartId; 
            
            if (!variantName) {
                const product = products.find(p => p.id === productId);
                let cartItem = cart.find(item => item.id === productId);
                
                if (cartItem) {
                    if (delta > 0 && cartItem.qty >= product.stock) return;
                    if (delta > 0 && cartItem.qty >= (product.maxLimit || 10)) {
                        alert(`Максимум ${product.maxLimit || 10} шт. в одни руки!`); return;
                    }
                    cartItem.qty += delta;
                    if (cartItem.qty <= 0) cart = cart.filter(item => item.id !== productId); 
                } else if (delta > 0) {
                    cart.push({ id: productId, title: product.title, price: product.price, qty: 1 });
                }
            } else {
                const product = products.find(p => p.id === productId);
                const variant = product.variants.find(v => v.name === variantName);
                let cartItem = cart.find(item => item.cartId === cartId);

                if (cartItem) {
                    if (delta > 0 && cartItem.qty >= variant.stock) return;
                    cartItem.qty += delta;
                    if (cartItem.qty <= 0) cart = cart.filter(item => item.cartId !== cartId); 
                } else if (delta > 0) {
                    cart.push({ 
                        cartId: cartId, 
                        id: productId, 
                        title: `${product.title} (${variantName})`, 
                        price: product.price, 
                        qty: 1 
                    });
                }
            }
            
            if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            saveCart(); updateBadge(); renderProducts(); 
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.cartId !== id && item.id !== id);
            if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
            saveCart(); updateBadge(); renderCart(); renderProducts();
        }

        function saveCart() { try { localStorage.setItem('legion_cart_cosmic', JSON.stringify(cart)); } catch(e) {} }
        
        function updateBadge() {
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('cart-badge');
            if (total > 0) { badge.style.display = 'flex'; badge.innerText = total; }
            else { badge.style.display = 'none'; }
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const emptyState = document.getElementById('cart-empty-state');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            if (cart.length === 0) { 
                container.innerHTML = ''; 
                emptyState.style.display = 'flex'; 
                checkoutBtn.style.display = 'none'; 
                return; 
            }
            emptyState.style.display = 'none'; 
            checkoutBtn.style.display = 'flex'; 
            
            let total = 0;
            
            let upsellHTML = '';
            const hasPodInCart = cart.some(item => {
                const p = products.find(prod => prod.id === item.id);
                return p && p.category === 'pods';
            });
            const cartridgeProduct = products.find(p => p.category === 'cartridges' && p.variants.some(v => v.stock > 0));
            const hasCartridgeInCart = cart.some(item => item.category === 'cartridges' || (products.find(p=>p.id===item.id) && products.find(p=>p.id===item.id).category === 'cartridges'));

            if (hasPodInCart && !hasCartridgeInCart && cartridgeProduct) {
                const cartVar = cartridgeProduct.variants.find(v => v.stock > 0);
                if (cartVar) {
                    const cartId = `${cartridgeProduct.id}_${cartVar.name}`;
                    upsellHTML = `
                        <div class="upsell-banner">
                            <div class="upsell-text">
                                <div>🔥 Отличное дополнение!</div>
                                <div>${cartridgeProduct.title} - ${cartridgeProduct.price} ₽</div>
                            </div>
                            <button class="upsell-btn" onclick="changeQty('${cartId}', 1, ${cartridgeProduct.id}, '${cartVar.name}'); renderCart();">+ Добавить</button>
                        </div>
                    `;
                }
            }

            container.innerHTML = cart.map(item => {
                const currentProduct = products.find(p => p.id === item.id);
                if (currentProduct) item.price = currentProduct.price;
                
                total += item.price * item.qty;
                let idForDeletion = item.cartId || item.id;
                
                return `
                <div class="cart-item">
                    <div style="flex-grow: 1;">
                        <div style="font-weight: 600; font-size: 15px;">${item.title}</div>
                        <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${item.qty} шт.</div>
                    </div>
                    <div style="font-weight:800; font-size:16px; color:var(--primary); text-shadow: 0 0 5px var(--primary); margin-right: 10px;">
                        ${item.price * item.qty} ₽
                    </div>
                    <button class="remove-btn" onclick="removeFromCart('${idForDeletion}')">✖</button>
                </div>`;
            }).join('') + upsellHTML;

            checkoutBtn.innerHTML = `<span>Оформить заказ</span> <span>${total} ₽</span>`;
        }

        // === АДМИНКА ===
        function renderAdminPanel() {
            const list = document.getElementById('admin-list');
            list.innerHTML = products.map(p => {
                let content = '';
                
                if (p.variants && p.variants.length > 0) {
                    let variantsList = p.variants.map((v, index) => `
                        <div class="admin-variant-row">
                            <div class="admin-variant-title">${v.name}</div>
                            <div class="admin-controls">
                                <button class="admin-btn" onclick="updateVariantStock(${p.id}, ${index}, -1)">-</button>
                                <input type="number" class="admin-input" value="${v.stock}" onchange="setVariantStock(${p.id}, ${index}, this.value)">
                                <button class="admin-btn" onclick="updateVariantStock(${p.id}, ${index}, 1)">+</button>
                            </div>
                        </div>
                    `).join('');
                    
                    content = `
                        ${variantsList}
                        <button class="add-variant-btn" onclick="addVariant(${p.id})">+ Добавить вариант</button>
                    `;
                } else {
                    content = `
                        <div class="admin-controls" style="justify-content: flex-end;">
                            <button class="admin-btn" onclick="updateStock(${p.id}, -1)">-</button>
                            <input type="number" class="admin-input" value="${p.stock}" onchange="setStock(${p.id}, this.value)">
                            <button class="admin-btn" onclick="updateStock(${p.id}, 1)">+</button>
                        </div>
                    `;
                }

                return `
                <div class="admin-item">
                    <div class="admin-header">
                        <div class="admin-title">${p.title}</div>
                    </div>
                    ${content}
                </div>
                `;
            }).join('');
        }

        function updateStock(id, delta) {
            const p = products.find(p => p.id === id);
            p.stock += delta;
            if(p.stock < 0) p.stock = 0;
            renderAdminPanel();
        }

        function setStock(id, val) {
            const p = products.find(p => p.id === id);
            p.stock = parseInt(val) || 0;
            if(p.stock < 0) p.stock = 0;
            renderAdminPanel();
        }

        function updateVariantStock(productId, variantIndex, delta) {
            const p = products.find(p => p.id === productId);
            p.variants[variantIndex].stock += delta;
            if(p.variants[variantIndex].stock < 0) p.variants[variantIndex].stock = 0;
            renderAdminPanel();
        }

        function setVariantStock(productId, variantIndex, val) {
            const p = products.find(p => p.id === productId);
            p.variants[variantIndex].stock = parseInt(val) || 0;
            if(p.variants[variantIndex].stock < 0) p.variants[variantIndex].stock = 0;
            renderAdminPanel();
        }

        function addVariant(productId) {
            const p = products.find(p => p.id === productId);
            let name = prompt("Введите название нового варианта (вкус/цвет):");
            if (name && name.trim() !== "") {
                p.variants.push({ name: name.trim(), stock: 0 });
                renderAdminPanel();
            }
        }

        function generateCode() {
            const textarea = document.getElementById('export-textarea');
            textarea.value = "let products = " + JSON.stringify(products, null, 4) + ";";
            textarea.style.display = 'block';
            textarea.select();
            document.execCommand('copy');
            alert("Код скопирован! Вставь его в index.html вместо старого 'let products = [...]'");
        }

        function switchTab(tabId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(`page-${tabId}`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');
            
            if (tabId === 'cart') renderCart();
            if (tabId === 'admin') renderAdminPanel();
        }

        function checkout() {
            if (cart.length === 0) return;
            
            let orderText = "🛒 Новый заказ из приложения:\n\n";
            let total = 0;
            
            cart.forEach((item, index) => {
                const currentProduct = products.find(p => p.id === item.id);
                if (currentProduct) item.price = currentProduct.price;
                
                orderText += `${index + 1}. ${item.title} — ${item.qty} шт. (${item.price * item.qty} ₽)\n`;
                total += item.price * item.qty;
            });
            
            orderText += `\n💰 Итого к оплате: ${total} ₽`;
            
            if (tgUser) {
                orderText += `\n\n👤 Заказчик: ${tgUser.first_name} ${tgUser.last_name || ''}`;
                if (tgUser.username) orderText += ` (@${tgUser.username})`;
            }
            
            cart = [];
            saveCart(); updateBadge(); renderProducts(); switchTab('catalog');
            const managerUsername = 'managerlegionshop';
            const encodedText = encodeURIComponent(orderText);
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openTelegramLink(`https://t.me/${managerUsername}?text=${encodedText}`);
            } else {
                window.open(`https://t.me/${managerUsername}?text=${encodedText}`, '_blank');
            }
        }

        initProfile();
        renderProducts(); 
        updateBadge();
    </script>
</body>
</html>
