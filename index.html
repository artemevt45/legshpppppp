<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LegionShop | Cosmic</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #02040a;
            --surface: rgba(10, 15, 30, 0.7);
            --surface-border: rgba(0, 240, 255, 0.3);
            --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.5);
            --text: #ffffff;
            --text-muted: #8ba3c7;
            --danger: #ff3366;
            --admin-color: #2ecc71;
        }

        #netlify-badge, .netlify-badge, iframe[title="netlify"], a[href*="netlify.com"], div[style*="netlify"] { display: none !important; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Exo 2', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 90px;
            overflow-x: hidden;
            position: relative;
        }

        /* ФОН С ЧЕРНОЙ ДЫРОЙ */
        .space-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: url('https://i.pinimg.com/736x/91/11/1f/91111fd5d503d82c3081f0239c16490e.jpg') center/cover no-repeat;
        }
        .space-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at center, rgba(2,4,10,0.3) 0%, rgba(2,4,10,0.9) 100%);
        }

        /* ПИКСЕЛЬНЫЕ РАКЕТЫ */
        .flying-objects {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            pointer-events: none; overflow: hidden;
        }

        .pixel-rocket {
            position: absolute; width: 40px; height: 40px; opacity: 0;
            filter: drop-shadow(0 0 8px rgba(255, 123, 0, 0.8)); /* Свечение от огня */
            shape-rendering: crispEdges; /* Чтобы пиксели были четкими */
        }

        /* Настройка траекторий и размеров ракет */
        .r1 { top: 10%; left: 110%; animation: rocketFly 6s linear infinite 0s; transform: scale(1); }
        .r2 { top: 40%; left: 110%; animation: rocketFly 8s linear infinite 2.5s; transform: scale(0.7); }
        .r3 { top: 75%; left: 110%; animation: rocketFly 5s linear infinite 4s; transform: scale(1.3); }
        .r4 { top: 25%; left: 110%; animation: rocketFly 7s linear infinite 6s; transform: scale(0.9); }
        .r5 { top: 60%; left: 110%; animation: rocketFly 9s linear infinite 1.5s; transform: scale(1.1); }

        @keyframes rocketFly {
            0% { transform: translate(0, 0) rotate(-45deg); opacity: 1; }
            100% { transform: translate(-130vw, 130vh) rotate(-45deg); opacity: 0; }
        }

        /* ШАПКА */
        .hero {
            position: relative; height: 120px; display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(2,4,10,0.4);
        }

        .hero h1 {
            font-size: 32px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase;
            color: var(--primary); text-shadow: 0 0 10px var(--primary-glow);
            font-family: monospace;
        }

        .filters { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn { background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--surface-border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 14px; white-space: nowrap; transition: 0.3s; cursor: pointer; }
        .filter-btn.active { background: var(--primary); color: #000; font-weight: 800; border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 20px 20px; }

        .card { background: var(--surface); backdrop-filter: blur(15px); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--surface-border); transition: 0.3s; position: relative; }
        .card:active { transform: scale(0.97); box-shadow: 0 0 20px var(--primary-glow); }
        
        /* МЕСТО ПОД ФОТО */
        .card-img-wrapper {
            width: 100%; height: 140px; background: linear-gradient(135deg, rgba(10,26,58,0.8), rgba(21,15,41,0.8));
            display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--surface-border);
        }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-no-img { width: 35px; height: 35px; fill: var(--primary); opacity: 0.6; }

        .badge { position: absolute; top: 10px; left: 10px; background: rgba(0, 242, 254, 0.9); color: #000; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; box-shadow: 0 0 10px var(--primary-glow); z-index: 2; }

        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.2; }
        .card-stock { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .stock-dot { width: 5px; height: 5px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); }
        
        .card-flavors { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-size: 16px; font-weight: 800; color: var(--text); }
        
        .buy-btn { background: transparent; border: 2px solid var(--primary); color: var(--primary); width: 34px; height: 34px; border-radius: 10px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .buy-btn:active { background: var(--primary); color: #000; }
        .qty-control { display: flex; align-items: center; background: rgba(0, 242, 254, 0.1); border: 1px solid var(--primary); border-radius: 10px; overflow: hidden; }
        .qty-btn { background: transparent; border: none; color: var(--primary); width: 28px; height: 32px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .qty-num { color: var(--text); font-weight: 800; font-size: 14px; min-width: 20px; text-align: center; }

        /* НИЖНЕЕ МЕНЮ (ТОЛЬКО ИКОНКИ) */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px; 
            background: rgba(5, 9, 20, 0.95); backdrop-filter: blur(20px); 
            display: flex; justify-content: space-around; align-items: center; 
            border-top: 1px solid var(--surface-border); z-index: 999; 
            padding-bottom: env(safe-area-inset-bottom); 
        }
        .nav-item { 
            display: flex; justify-content: center; align-items: center; 
            width: 50px; height: 50px; cursor: pointer; position: relative;
            border-radius: 50%; transition: 0.3s;
        }
        .nav-item:active { background: rgba(255,255,255,0.1); }
        .nav-item.active { color: var(--primary); }
        .nav-icon { width: 32px; height: 32px; fill: currentColor; transition: 0.3s; }
        .nav-item.active .nav-icon { filter: drop-shadow(0 0 8px var(--primary-glow)); }
        
        .cart-badge { position: absolute; top: 2px; right: 2px; background: var(--danger); color: white; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; display: none; box-shadow: 0 0 10px var(--danger); border: 1px solid #000; }

        .page { display: none; animation: fadeIn 0.4s ease-out; } .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .cart-container { padding: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--surface-border); padding: 15px; border-radius: 16px; margin-bottom: 10px; }
        .checkout-btn { position: fixed; bottom: 90px; left: 20px; right: 20px; background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%); color: #000; padding: 16px; border-radius: 16px; border: none; font-size: 16px; font-weight: 800; text-transform: uppercase; box-shadow: 0 10px 20px var(--primary-glow); cursor: pointer; display: none; }

        .profile-menu-item { background: var(--surface); border: 1px solid var(--surface-border); padding: 16px; border-radius: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .profile-menu-item span { font-size: 15px; font-weight: 600; }
        .profile-menu-item .arrow { color: var(--primary); font-size: 18px; }

        /* Админка */
        .admin-item { display: flex; flex-direction: column; background: var(--surface); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--surface-border); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .admin-title { font-size: 14px; font-weight: 600; }
        .admin-controls { display: flex; align-items: center; gap: 10px; }
        .admin-btn { background: var(--surface); border: 1px solid var(--admin-color); color: var(--admin-color); width: 30px; height: 30px; border-radius: 8px; font-size: 18px; cursor: pointer; }
        .admin-input { width: 50px; text-align: center; background: transparent; border: 1px solid var(--admin-color); color: white; border-radius: 8px; font-size: 16px; font-weight: bold; }
        .admin-flavors-input { width: 100%; padding: 8px; background: rgba(0,0,0,0.5); border: 1px solid var(--admin-color); color: #fff; border-radius: 8px; font-family: 'Exo 2'; font-size: 12px; }
        
        .export-btn { width: 100%; background: var(--admin-color); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 16px; }
        #export-textarea { width: 100%; height: 150px; background: #000; color: var(--admin-color); border: 1px solid var(--admin-color); margin-top: 10px; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; display: none; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(0, 242, 254, 0.9); color: #000; padding: 12px 24px; border-radius: 30px; font-weight: 800; font-size: 14px; transition: 0.4s; z-index: 2000; opacity: 0; pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>

    <script>
        // ЭФФЕКТ МАТРИЦЫ
        function runMatrixEffect() {
            const targetText = "LEGION SHOP";
            const chars = "!<>-_\\/[]{}—=+*^?#________01";
            let iteration = 0;
            const el = document.getElementById("matrix-text");
            
            const interval = setInterval(() => {
                el.innerText = targetText
                    .split("")
                    .map((letter, index) => {
                        if(index < iteration) return targetText[index];
                        return chars[Math.floor(Math.random() * chars.length)];
                    })
                    .join("");
                
                if(iteration >= targetText.length) clearInterval(interval);
                iteration += 1 / 3;
            }, 50);
        }

        const ADMIN_USERNAME = 'managerlegionshop'; 
        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        if (tgUser && tgUser.username === ADMIN_USERNAME) document.getElementById('nav-admin').style.display = 'flex';

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
            window.Telegram.WebApp.setHeaderColor('#02040a');
        }

        let products = [
            { id: 1, title: "XROS 6 Mini Black", desc: "Цвет: Черный", stock: 5, price: 1800, category: "pods", badge: "ХИТ", img: "" },
            { id: 2, title: "XROS 6 Mini Jelly Blue", desc: "Цвет: Голубой", stock: 3, price: 1800, category: "pods", badge: "NEW", img: "" },
            { 
                id: 3, 
                title: "Монашка Sweet", 
                desc: "80 мг", 
                flavors: ["Арбуз лайм малина", "Газировка с вишней", "Клубника банан", "Мохито со льдом", "Черника дыня", "Кислый Чупа-Чупс"],
                stock: 10, 
                price: 500, 
                category: "liquids", 
                badge: "",
                img: ""
            },
            { 
                id: 4, 
                title: "Самоубийца 100мг", 
                desc: "Danger", 
                flavors: ["Кислое яблоко ежевика", "Зеленый скиттлс", "Кола лесные ягоды", "Классический энергетик"],
                stock: 8, 
                price: 550, 
                category: "liquids", 
                badge: "ТОП",
                img: ""
            }
        ];

        let cart = [];
        let activeCategory = 'all'; 
        try { cart = JSON.parse(localStorage.getItem('legion_cart_cosmic')) || []; } catch(e) {}

        function filterProducts(category, btnElement) {
            activeCategory = category; 
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('catalog-grid');
            
            let filtered = products.filter(p => p.stock > 0);
            if (activeCategory !== 'all') {
                filtered = filtered.filter(p => p.category === activeCategory);
            }
            
            grid.innerHTML = filtered.map(p => {
                const cartItem = cart.find(item => item.id === p.id);
                const qty = cartItem ? cartItem.qty : 0;
                
                let actionHTML = qty === 0 
                    ? `<button class="buy-btn" onclick="changeQty(${p.id}, 1)">+</button>`
                    : `<div class="qty-control"><button class="qty-btn" onclick="changeQty(${p.id}, -1)">-</button><span class="qty-num">${qty}</span><button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button></div>`;

                let imgHTML = '';
                if (p.img && p.img.trim() !== "") {
                    imgHTML = `<img src="${p.img}" class="card-img" alt="${p.title}">`;
                } else {
                    let iconSVG = p.category === 'pods' 
                        ? `<svg class="card-no-img" viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-2 12H8V8h8v8z"/></svg>` 
                        : `<svg class="card-no-img" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`;
                    imgHTML = iconSVG;
                }

                let infoHTML = '';
                if (p.category === 'liquids' && p.flavors) {
                    infoHTML = `<div class="card-flavors"><span style="color:var(--primary); font-weight:600;">Вкусы:</span> ${p.flavors.join(', ')}</div>`;
                } else {
                    infoHTML = `<div class="card-stock"><div class="stock-dot"></div> В наличии (${p.stock})</div>`;
                }

                return `
                <div class="card">
                    <div class="card-img-wrapper">
                        ${imgHTML}
                        ${p.badge ? `<div class="badge">${p.badge}</div>` : ''}
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="card-title">${p.title}</div>
                            <div style="font-size:10px; color:var(--primary); margin-bottom:4px;">${p.desc}</div>
                            ${infoHTML}
                        </div>
                        <div class="card-footer">
                            <div class="price">${p.price} ₽</div>
                            ${actionHTML}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function changeQty(id, delta) {
            const existing = cart.find(item => item.id === id);
            const product = products.find(p => p.id === id);
            
            if (existing) {
                if (delta > 0 && existing.qty >= product.stock) return;
                existing.qty += delta;
                if (existing.qty <= 0) cart = cart.filter(item => item.id !== id); 
            } else if (delta > 0) {
                cart.push({ ...product, qty: 1 });
            }
            
            if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            saveCart(); updateBadge(); renderProducts(); 
        }

        function saveCart() { try { localStorage.setItem('legion_cart_cosmic', JSON.stringify(cart)); } catch(e) {} }
        
        function updateBadge() {
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('cart-badge');
            if (total > 0) { badge.style.display = 'flex'; badge.innerText = total; }
            else { badge.style.display = 'none'; }
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const emptyState = document.getElementById('cart-empty-state');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            if (cart.length === 0) { container.innerHTML = ''; emptyState.style.display = 'block'; checkoutBtn.style.display = 'none'; return; }
            emptyState.style.display = 'none'; checkoutBtn.style.display = 'block';
            
            let total = 0;
            container.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `<div class="cart-item"><div><div style="font-weight: 600; font-size: 15px;">${item.title}</div><div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${item.qty} шт.</div></div><div style="font-weight:800; font-size:16px; color:var(--primary);">${item.price * item.qty} ₽</div></div>`;
            }).join('') + `<div style="margin-top:20px; font-size:20px; font-weight:800; display:flex; justify-content:space-between; border-top: 1px solid var(--surface-border); padding-top: 15px;"><span>Итого:</span> <span style="color:var(--primary);">${total} ₽</span></div>`;
        }

        // === АДМИНКА ===
        function renderAdminPanel() {
            const list = document.getElementById('admin-list');
            list.innerHTML = products.map(p => {
                let controlHTML = '';
                
                if (p.category === 'liquids') {
                    controlHTML = `
                        <input type="text" class="admin-flavors-input" value="${p.flavors ? p.flavors.join(', ') : ''}" onchange="setFlavors(${p.id}, this.value)" placeholder="Вкусы через запятую">
                        <div style="margin-top:10px; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--text-muted);">
                            Скрыть (0): <input type="number" class="admin-input" value="${p.stock}" onchange="setStock(${p.id}, this.value)">
                        </div>
                    `;
                } else {
                    controlHTML = `
                        <div class="admin-controls">
                            <button class="admin-btn" onclick="updateStock(${p.id}, -1)">-</button>
                            <input type="number" class="admin-input" value="${p.stock}" onchange="setStock(${p.id}, this.value)">
                            <button class="admin-btn" onclick="updateStock(${p.id}, 1)">+</button>
                        </div>
                    `;
                }

                return `
                <div class="admin-item">
                    <div class="admin-header">
                        <div class="admin-title">${p.title}</div>
                        ${p.category !== 'liquids' ? controlHTML : ''}
                    </div>
                    ${p.category === 'liquids' ? controlHTML : ''}
                </div>
                `;
            }).join('');
        }

        function updateStock(id, delta) {
            const p = products.find(p => p.id === id);
            p.stock += delta;
            if(p.stock < 0) p.stock = 0;
            renderAdminPanel();
        }

        function setStock(id, val) {
            const p = products.find(p => p.id === id);
            p.stock = parseInt(val) || 0;
            if(p.stock < 0) p.stock = 0;
            renderAdminPanel();
        }

        function setFlavors(id, val) {
            const p = products.find(p => p.id === id);
            p.flavors = val.split(',').map(f => f.trim()).filter(f => f !== '');
            renderAdminPanel();
        }

        function generateCode() {
            const textarea = document.getElementById('export-textarea');
            textarea.value = "let products = " + JSON.stringify(products, null, 4) + ";";
            textarea.style.display = 'block';
            textarea.select();
            document.execCommand('copy');
            alert("Код скопирован! Вставь его в index.html вместо старого 'let products = [...]'");
        }

        function switchTab(tabId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(`page-${tabId}`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');
            
            if (tabId === 'cart') renderCart();
            if (tabId === 'admin') renderAdminPanel();
        }

        function checkout() {
            if (cart.length === 0) return;
            let orderText = "🛒 *Новый заказ из приложения:*\n\n";
            let total = 0;
            cart.forEach(item => {
                orderText += `▪️ ${item.title} — ${item.qty} шт. (${item.price * item.qty} ₽)\n`;
                total += item.price * item.qty;
            });
            orderText += `\n💰 *Итого к оплате: ${total} ₽*`;
            
            cart = [];
            saveCart(); updateBadge(); renderProducts(); switchTab('catalog');
            const managerUsername = 'managerlegionshop';
            const encodedText = encodeURIComponent(orderText);
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openTelegramLink(`https://t.me/${managerUsername}?text=${encodedText}`);
            } else {
                window.open(`https://t.me/${managerUsername}?text=${encodedText}`, '_blank');
            }
        }

        runMatrixEffect();
        renderProducts(); 
        updateBadge();
    </script>
</body>
</html>
