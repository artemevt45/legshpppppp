<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LegionShop | Cosmic</title>
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase через CDN (гарантированно работает) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root, body[data-theme="base"] {
            --bg: #02040a; --surface: rgba(10, 15, 30, 0.85); --surface-solid: #0a0f1e;
            --text: #ffffff; --text-muted: #a0b8d6; --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.6); --danger: #ff3366;
            --nav-bg: rgba(2, 4, 10, 0.95); --bg-image: url('bazatema.jpg'); --modal-bg: #0d1425;
        }
        body[data-theme="dark"] {
            --bg: #000000; --surface: rgba(20, 20, 20, 0.85); --surface-solid: #141414;
            --text: #ffffff; --text-muted: #aaaaaa; --primary: #ffffff;
            --primary-glow: rgba(255, 255, 255, 0.6); --nav-bg: rgba(0, 0, 0, 0.95);
            --bg-image: url('blacktema.jpg'); --modal-bg: #111111;
        }
        body[data-theme="light"] {
            --bg: #f0f2f5; --surface: rgba(255, 255, 255, 0.95); --surface-solid: #ffffff;
            --text: #111111; --text-muted: #444444; --primary: #007aff;
            --primary-glow: rgba(0, 122, 255, 0.4); --nav-bg: rgba(255, 255, 255, 0.95);
            --bg-image: url('whitetema.jpg'); --modal-bg: #ffffff;
        }
        body[data-theme="red"] {
            --bg: #0a0000; --surface: rgba(40, 0, 0, 0.85); --surface-solid: #2b0000;
            --text: #ffffff; --text-muted: #e0a0a0; --primary: #d32f2f;
            --primary-glow: rgba(211, 47, 47, 0.6); --nav-bg: rgba(10, 0, 0, 0.95);
            --bg-image: url('redtema.jpg'); --modal-bg: #2a0505;
        }
        body[data-theme="gray"] {
            --bg: #1a1a1a; --surface: rgba(40, 40, 40, 0.85); --surface-solid: #282828;
            --text: #ffffff; --text-muted: #bbbbbb; --primary: #b0bec5; 
            --primary-glow: rgba(176, 190, 197, 0.6); --nav-bg: rgba(26, 26, 26, 0.95);
            --bg-image: url('bazatema.jpg'); --modal-bg: #222222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Exo 2', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; overflow-x: hidden; position: relative; transition: background-color 0.3s, color 0.3s; }
        .space-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: var(--bg-image) center/cover no-repeat; opacity: 1; transition: background 0.3s; }
        .space-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, transparent 0%, var(--bg) 100%); transition: background 0.3s; }

        .hero { position: relative; height: 100px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(128, 128, 128, 0.2); background: rgba(0,0,0,0.1); }
        .hero h1 { font-size: 38px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); display: flex; gap: 2px; }
        .hero h1 span { display: inline-block; opacity: 0; transform: translateY(-30px); animation: pianoDrop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes pianoDrop { to { opacity: 1; transform: translateY(0); } }

        .search-container { padding: 15px 20px 5px 20px; position: relative; display: flex; align-items: center; }
        .search-icon { position: absolute; left: 35px; width: 20px; height: 20px; fill: var(--primary); filter: drop-shadow(0 0 5px var(--primary)); pointer-events: none; z-index: 2; }
        .search-input { width: 100%; padding: 12px 15px 12px 45px; background: var(--surface); border: 1px solid transparent; background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(45deg, var(--primary), #ffffff, var(--primary)) border-box; border-radius: 12px; color: var(--text); font-size: 14px; outline: none; transition: 0.3s; box-shadow: 0 0 15px var(--primary-glow); }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { box-shadow: 0 0 25px var(--primary-glow); }

        .filters-wrapper { padding: 15px 20px 5px 20px; }
        .filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn { background: var(--surface); border: 1px solid var(--primary-glow); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 14px; white-space: nowrap; transition: 0.3s; cursor: pointer; }
        .filter-btn.active { background: var(--primary); color: var(--bg); font-weight: 800; box-shadow: 0 0 15px var(--primary-glow); }

        .filter-trigger-container { padding: 5px 20px 15px 20px; display: flex; justify-content: flex-start; }
        .open-filter-btn { background: var(--surface); border: 1px solid var(--primary-glow); color: var(--text); padding: 6px 16px; border-radius: 12px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.3s; font-weight: 600; }
        .open-filter-btn:active { background: var(--primary); color: var(--bg); }

        #filter-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; background: rgba(0, 0, 0, 0.85); backdrop-filter: none; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        #filter-modal.active { display: flex; opacity: 1; }
        .filter-content { background: var(--modal-bg); width: 85%; max-width: 360px; border-radius: 20px; padding: 20px; border: 1px solid var(--primary-glow); box-shadow: 0 0 30px var(--primary-glow); transform: translateY(20px); transition: transform 0.3s; max-height: 75vh; overflow-y: auto; }
        #filter-modal.active .filter-content { transform: translateY(0); }
        .filter-content h3 { font-size: 16px; margin-bottom: 15px; color: var(--primary); text-align: center; }
        .filter-group { margin-bottom: 20px; }
        .filter-group-title { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;}
        .radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .radio-label { display: flex; align-items: center; padding: 8px 12px; background: var(--surface-solid); border-radius: 10px; border: 1px solid transparent; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .radio-label:active { background: rgba(128, 128, 128, 0.2); }
        .radio-label input[type="radio"] { display: none; }
        .radio-custom { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text-muted); margin-right: 8px; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .radio-label input[type="radio"]:checked + .radio-custom { border-color: var(--primary); }
        .radio-label input[type="radio"]:checked + .radio-custom::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 8px var(--primary); }
        .radio-label input[type="radio"]:checked ~ span { color: var(--primary); font-weight: 600; }
        .apply-btn { width: 100%; background: var(--primary); color: var(--bg); border: none; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 0 15px var(--primary-glow); text-transform: uppercase; }
        .apply-btn:active { transform: scale(0.95); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 20px 20px; align-items: start; }
        .card { border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: all 0.3s ease; border: 2px solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(135deg, var(--primary), var(--bg), var(--primary)) border-box; background-size: 300% 300%; animation: borderShine 6s linear infinite; }
        @keyframes borderShine { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .card:hover, .card:active { transform: scale(0.98) translateY(-2px); box-shadow: 0 0 25px var(--primary-glow), inset 0 0 15px var(--primary-glow); border-color: var(--primary); }
        .card.out-of-stock { filter: grayscale(0.5); opacity: 0.85; border-color: #444; }
        .card.out-of-stock .price { color: #777; text-shadow: none; }
        .card-img-wrapper { width: 100%; height: 170px; background: #ffffff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(128, 128, 128, 0.2); position: relative; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: contain; padding: 5px; transition: transform 0.3s; }
        .card:hover .card-img { transform: scale(1.05); }
        .card-no-img { width: 40px; height: 40px; fill: var(--primary); opacity: 0.5; filter: drop-shadow(0 0 10px var(--primary)); }
        .badge { position: absolute; top: 10px; left: 10px; background: linear-gradient(90deg, var(--primary), #ffffff); color: #000; padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 900; text-transform: uppercase; z-index: 2; animation: badgePulse 2s infinite alternate; }
        @keyframes badgePulse { 0% { box-shadow: 0 0 5px var(--primary-glow); transform: scale(1); } 100% { box-shadow: 0 0 20px var(--primary), 0 0 10px var(--primary); transform: scale(1.05); } }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.2; color: var(--text); }
        .card-stock { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .stock-dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-size: 18px; font-weight: 800; color: var(--primary); text-shadow: 0 0 8px var(--primary-glow); }
        .buy-btn { background: rgba(128, 128, 128, 0.1); border: 2px solid var(--primary); color: var(--primary); width: 36px; height: 36px; border-radius: 10px; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px var(--primary-glow); padding-bottom: 3px; line-height: 1; }
        .buy-btn:active:not(:disabled) { background: var(--primary); color: var(--bg); box-shadow: 0 0 25px var(--primary); }
        .qty-control { display: flex; align-items: center; background: rgba(128, 128, 128, 0.1); border: 1px solid var(--primary); border-radius: 10px; overflow: hidden; }
        .qty-btn { background: transparent; border: none; color: var(--primary); width: 28px; height: 32px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .qty-num { color: var(--text); font-weight: 800; font-size: 14px; min-width: 20px; text-align: center; }
        .choose-flavor-btn { background: rgba(0, 242, 254, 0.1); color: var(--primary); border: 1px solid var(--primary); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 11px; margin-top: 8px; cursor: pointer; text-transform: uppercase; transition: 0.3s; width: auto; align-self: flex-start; }
        .choose-flavor-btn:active { background: var(--primary); color: var(--bg); }
        .variants-container { display: none; flex-direction: column; gap: 8px; margin-top: 10px; border-top: 1px solid rgba(128, 128, 128, 0.2); padding-top: 10px; width: 100%;}
        .variant-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface-solid); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(128, 128, 128, 0.2); }
        .glossy-stock-box { background: linear-gradient(135deg, #ffffff, #c0c0c0, #ffffff); color: #000; font-weight: 900; font-size: 12px; padding: 2px 6px; border-radius: 4px; box-shadow: 0 0 8px rgba(255, 255, 255, 0.6); min-width: 22px; text-align: center; margin-right: 8px; }
        .variant-name { font-size: 11px; color: var(--text); flex-grow: 1; }
        .variant-item .qty-control { height: 28px; }
        .variant-item .qty-btn { height: 28px; width: 24px; font-size: 16px; }
        .variant-item .qty-num { font-size: 12px; }
        .variant-item .buy-btn { height: 28px; width: 28px; font-size: 18px; border-radius: 8px; padding-bottom: 2px;}

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--nav-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--primary-glow); z-index: 999; padding-bottom: env(safe-area-inset-bottom); transition: background 0.3s; }
        .nav-item { display: flex; justify-content: center; align-items: center; width: 50px; height: 50px; cursor: pointer; position: relative; border-radius: 50%; transition: 0.3s; color: var(--text-muted); }
        .nav-item.active { color: var(--primary); }
        .nav-icon-svg { width: 30px; height: 30px; fill: currentColor; transition: 0.3s; }
        .nav-item.active .nav-icon-svg { filter: drop-shadow(0 0 10px var(--primary)); }
        .cart-badge { position: absolute; top: 2px; right: 2px; background: var(--danger); color: white; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; display: none; box-shadow: 0 0 10px var(--danger); border: 1px solid #000; }

        .page { display: none; animation: fadeIn 0.4s ease-out; } .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .cart-container { padding: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--primary-glow); padding: 15px; border-radius: 16px; margin-bottom: 10px; }
        .remove-btn { background: transparent; border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; margin-left: 10px; }
        .remove-btn:active { background: var(--danger); color: #fff; box-shadow: 0 0 10px var(--danger); }
        #cart-empty-state { text-align: center; margin-top: 50px; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pug-img { width: 180px; height: 180px; margin-bottom: 20px; filter: drop-shadow(0 0 25px var(--primary-glow)); animation: floatPug 3s ease-in-out infinite; border-radius: 20px; object-fit: contain; }
        @keyframes floatPug { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .empty-cart-text { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: var(--text); }
        .go-catalog-btn { background: var(--primary); color: var(--bg); border: none; padding: 12px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 0 15px var(--primary-glow); transition: 0.3s; text-transform: uppercase; }
        .go-catalog-btn:active { transform: scale(0.95); }

        @keyframes breathe { 0% { box-shadow: 0 0 10px var(--primary-glow); transform: scale(1); } 50% { box-shadow: 0 0 25px var(--primary), 0 0 40px var(--primary-glow); transform: scale(1.02); } 100% { box-shadow: 0 0 10px var(--primary-glow); transform: scale(1); } }
        .checkout-btn { position: fixed; bottom: 90px; left: 20px; right: 20px; background: linear-gradient(90deg, var(--primary) 0%, var(--primary-glow) 100%); color: var(--bg); padding: 16px 20px; border-radius: 16px; border: none; font-size: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer; display: none; justify-content: space-between; align-items: center; animation: breathe 2s infinite ease-in-out; }

        .profile-menu-item { background: var(--surface); border: 1px solid var(--primary-glow); padding: 16px; border-radius: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--text); }
        .profile-menu-item span { font-size: 15px; font-weight: 600; }
        .profile-menu-item .arrow { color: var(--primary); font-size: 18px; }

        .theme-btn { flex: 1; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; border: 1px solid transparent; transition: 0.2s; font-family: 'Exo 2', sans-serif;}
        .theme-btn:active { transform: scale(0.95); }

        .promo-container { background: var(--surface); border: 1px solid var(--primary-glow); padding: 15px; border-radius: 16px; margin-bottom: 20px; }
        .promo-input { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--primary); border-radius: 8px; color: var(--text); margin-bottom: 10px; font-size: 14px; text-transform: uppercase; }
        .promo-btn { width: 100%; background: var(--primary); color: var(--bg); border: none; padding: 10px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        .promo-message { font-size: 13px; margin-top: 8px; text-align: center; }

        @media (max-width: 768px) { .card { animation: borderShine 20s linear infinite; } }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); max-width: 900px; margin: 0 auto; } }
    </style>
</head>
<body>
    <div class="space-bg"></div>
    <div class="space-overlay"></div>

    <div id="filter-modal">
        <div class="filter-content">
            <h3>Фильтры</h3>
            <div class="filter-group">
                <div class="filter-group-title">Сортировка</div>
                <div class="radio-grid">
                    <label class="radio-label"><input type="radio" name="sort" value="default" checked onchange="setSort('default')"><div class="radio-custom"></div> <span>По умолч.</span></label>
                    <label class="radio-label"><input type="radio" name="sort" value="cheap" onchange="setSort('cheap')"><div class="radio-custom"></div> <span>Дешевле</span></label>
                    <label class="radio-label"><input type="radio" name="sort" value="expensive" onchange="setSort('expensive')"><div class="radio-custom"></div> <span>Дороже</span></label>
                </div>
            </div>
            <div class="filter-group" id="brand-section" style="display: none;">
                <div class="filter-group-title">Бренд</div>
                <div class="radio-grid">
                    <label class="radio-label"><input type="radio" name="brand" value="all" checked onchange="setBrand('all')"><div class="radio-custom"></div> <span>Все</span></label>
                    <label class="radio-label"><input type="radio" name="brand" value="Vaporesso" onchange="setBrand('Vaporesso')"><div class="radio-custom"></div> <span>Vaporesso</span></label>
                    <label class="radio-label"><input type="radio" name="brand" value="Smoant" onchange="setBrand('Smoant')"><div class="radio-custom"></div> <span>Smoant</span></label>
                    <label class="radio-label"><input type="radio" name="brand" value="Geekvape" onchange="setBrand('Geekvape')"><div class="radio-custom"></div> <span>Geekvape</span></label>
                </div>
            </div>
            <div class="filter-group" id="mg-section" style="display: none;">
                <div class="filter-group-title">Крепость (мг)</div>
                <div class="radio-grid">
                    <label class="radio-label"><input type="radio" name="mg" value="0" checked onchange="setMg(0)"><div class="radio-custom"></div> <span>Все</span></label>
                    <label class="radio-label"><input type="radio" name="mg" value="20" onchange="setMg(20)"><div class="radio-custom"></div> <span>20</span></label>
                    <label class="radio-label"><input type="radio" name="mg" value="50" onchange="setMg(50)"><div class="radio-custom"></div> <span>50</span></label>
                    <label class="radio-label"><input type="radio" name="mg" value="70" onchange="setMg(70)"><div class="radio-custom"></div> <span>70</span></label>
                    <label class="radio-label"><input type="radio" name="mg" value="80" onchange="setMg(80)"><div class="radio-custom"></div> <span>80</span></label>
                    <label class="radio-label"><input type="radio" name="mg" value="90" onchange="setMg(90)"><div class="radio-custom"></div> <span>90</span></label>
                    <label class="radio-label"><input type="radio" name="mg" value="100" onchange="setMg(100)"><div class="radio-custom"></div> <span>100</span></label>
                </div>
            </div>
            <button class="apply-btn" onclick="closeFilters()">Применить</button>
        </div>
    </div>

    <div id="page-catalog" class="page active">
        <div class="hero"><h1 id="header-title"></h1></div>
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Найти товар..." oninput="handleSearch()">
        </div>
        <div class="filters-wrapper">
            <div class="filters">
                <button class="filter-btn active" onclick="filterProducts('all', this)">Все</button>
                <button class="filter-btn" onclick="filterProducts('pods', this)">Поды</button>
                <button class="filter-btn" onclick="filterProducts('liquids', this)">Жижа</button>
                <button class="filter-btn" onclick="filterProducts('cartridges', this)">Картриджи</button>
            </div>
        </div>
        <div class="filter-trigger-container">
            <button class="open-filter-btn" onclick="openFilters()">⚙️ Фильтры</button>
        </div>
        <div class="grid" id="catalog-grid"></div>
    </div>

    <div id="page-cart" class="page">
        <div class="cart-container">
            <h2 style="margin-bottom: 20px; color: var(--primary); text-shadow: 0 0 10px var(--primary-glow);">КОРЗИНА</h2>
            
            <div class="promo-container">
                <input type="text" id="promoInput" class="promo-input" placeholder="Введите промокод">
                <button class="promo-btn" onclick="applyPromo()">Применить</button>
                <div id="promoMessage" class="promo-message"></div>
            </div>

            <div id="cart-items"></div>
            <div id="cart-empty-state">
                <img src="mops.jpg" alt="Pug" class="pug-img" onerror="this.style.display='none'">
                <div class="empty-cart-text">Тут пока пусто...</div>
                <button class="go-catalog-btn" onclick="switchTab('catalog')">Перейти в каталог</button>
            </div>
        </div>
        <button class="checkout-btn" id="checkout-btn" onclick="checkout()"></button>
    </div>

    <div id="page-profile" class="page">
        <div class="cart-container">
            <div style="display:flex; align-items:center; gap:15px; margin-bottom:30px;">
                <div id="user-avatar" style="width:60px; height:60px; background:linear-gradient(135deg, var(--primary), var(--primary-glow)); border-radius:50%; box-shadow: 0 0 20px var(--primary-glow); display:flex; justify-content:center; align-items:center; font-size:24px; font-weight:800; color:var(--bg); background-size:cover; background-position:center;"></div>
                <div>
                    <h3 id="user-name" style="font-size:18px;">Загрузка...</h3>
                    <p id="user-username" style="color:var(--primary); font-size:14px;">@...</p>
                </div>
            </div>
            <h3 style="margin-bottom: 10px; font-size: 15px; color: var(--text-muted);">ТЕМА ОФОРМЛЕНИЯ</h3>
            <div style="display: flex; gap: 8px; margin-bottom: 25px;">
                <button onclick="setTheme('base')" class="theme-btn" style="background: #02040a; color: #00f2fe; border-color: #00f2fe;">Базовая</button>
                <button onclick="setTheme('dark')" class="theme-btn" style="background: #000; color: #fff; border-color: #fff;">Темная</button>
                <button onclick="setTheme('light')" class="theme-btn" style="background: #f0f2f5; color: #000; border-color: #ccc;">Светлая</button>
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 30px;">
                <button onclick="setTheme('red')" class="theme-btn" style="background: #2b0000; color: #d32f2f; border-color: #d32f2f;">Красная</button>
                <button onclick="setTheme('gray')" class="theme-btn" style="background: #333; color: #b0bec5; border-color: #b0bec5;">Серая</button>
            </div>
            <div class="profile-menu-item" onclick="window.open('https://t.me/legionshopkurgan', '_blank')"><div><span>Наш ТГК</span></div><span class="arrow">›</span></div>
            <div class="profile-menu-item" onclick="window.open('https://t.me/managerlegionshop', '_blank')"><div><span>Поддержка</span></div><span class="arrow">›</span></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="switchTab('catalog')" id="nav-catalog">
            <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
        <div class="nav-item" onclick="switchTab('cart')" id="nav-cart">
            <div style="position:relative;">
                <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <div class="cart-badge" id="cart-badge">0</div>
            </div>
        </div>
        <div class="nav-item" onclick="switchTab('profile')" id="nav-profile">
            <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
    </div>

    <script>
        // === SUPABASE CONFIG ===
        const SUPABASE_URL = 'https://xfgkuwcuelpzqlgnpmjb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-d8V0nobaXvNn7rMVcR6Tw_bXVmVNOd';
        
        let supabase = null;
        try {
            if (typeof window.supabase !== 'undefined') {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else {
                console.warn('Supabase library not loaded via CDN');
            }
        } catch (e) { console.error(e); }

        // === INIT ===
        const savedTheme = localStorage.getItem('legion_theme') || 'base';
        document.body.setAttribute('data-theme', savedTheme);
        function setTheme(theme) { document.body.setAttribute('data-theme', theme); localStorage.setItem('legion_theme', theme); }

        function runPianoEffect() {
            const el = document.getElementById("header-title"); const t = "LEGION SHOP"; el.innerHTML = "";
            t.split("").forEach((c, i) => { if(c===" ") el.innerHTML+="&nbsp;"; else { const s=document.createElement("span"); s.innerText=c; s.style.animationDelay=`${i*0.15}s`; el.appendChild(s);} });
        }
        runPianoEffect();

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            window.Telegram.WebApp.setHeaderColor('#02040a');
        }

        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        function initProfile() {
            const n=document.getElementById('user-name'), u=document.getElementById('user-username'), a=document.getElementById('user-avatar');
            if(tgUser){ let f=tgUser.first_name||''; if(tgUser.last_name)f+=' '+tgUser.last_name; n.innerText=f; u.innerText=tgUser.username?'@'+tgUser.username:'@id'+tgUser.id;
                if(tgUser.photo_url){a.style.backgroundImage=`url('${tgUser.photo_url}')`;a.innerText='';} else a.innerText=(tgUser.first_name?tgUser.first_name[0].toUpperCase():'?');
            } else {n.innerText="Гость";u.innerText="@no_telegram";a.innerText="Г";}
        }

        // === DATA & STATE ===
        let products = [];
        let cart = [];
        try { cart = JSON.parse(localStorage.getItem('legion_cart_cosmic')) || []; } catch(e) {}
        let activeCategory = 'all', searchQuery = '', openAccordions = {}, currentSort = 'default', currentMg = 0, currentBrand = 'all', currentDiscount = 0;

        async function loadProducts() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '<div style="padding:40px;text-align:center;color:var(--primary);grid-column:1/-1;">Загрузка каталога...</div>';
            
            try {
                if (!supabase) throw new Error("Supabase client not initialized");
                const { data: dbProducts, error } = await supabase.from('products').select(`*, variants (id, name, stock)`);
                if (error) throw error;
                
                products = (dbProducts || []).map(p => ({
                    id: p.id, title: p.title, brand: p.brand || '', desc: p.description, price: p.price,
                    category: p.category, badge: p.badge, img: p.img, mg: p.mg || 0, stock: p.stock || 0, variants: p.variants || []
                }));
                renderProducts();
            } catch (err) {
                grid.innerHTML = `<div style="padding:20px;text-align:center;color:var(--danger);grid-column:1/-1;">Ошибка загрузки: ${err.message}</div>`;
            }
        }

        // === FILTERS & RENDER ===
        function openFilters() {
            const m=document.getElementById('filter-modal');
            document.getElementById('mg-section').style.display=(activeCategory==='liquids')?'block':'none';
            document.getElementById('brand-section').style.display=(activeCategory==='pods')?'block':'none';
            m.style.display='flex'; setTimeout(()=>m.classList.add('active'),10);
        }
        function closeFilters() { const m=document.getElementById('filter-modal'); m.classList.remove('active'); setTimeout(()=>m.style.display='none',300); renderProducts(); }
        function setSort(s){currentSort=s;} function setMg(m){currentMg=parseInt(m);} function setBrand(b){currentBrand=b;}
        function handleSearch(){ searchQuery=document.getElementById('searchInput').value.toLowerCase(); renderProducts(); }
        function filterProducts(cat,btn){ activeCategory=cat; document.querySelectorAll('.filters .filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderProducts(); }
        function toggleVariants(id){ openAccordions[id]=!openAccordions[id]; const c=document.getElementById(`variants-${id}`); if(c)c.style.display=openAccordions[id]?'flex':'none'; }

        function renderProducts() {
            const grid = document.getElementById('catalog-grid');
            let filtered = products.filter(p => {
                if(activeCategory!=='all'&&p.category!==activeCategory)return false;
                if(activeCategory==='liquids'&&currentMg>0&&p.mg!==currentMg)return false;
                if(activeCategory==='pods'&&currentBrand!=='all'&&p.brand!==currentBrand)return false;
                if(searchQuery!==''){ let mt=p.title.toLowerCase().includes(searchQuery); let mv=p.variants&&p.variants.some(v=>v.name.toLowerCase().includes(searchQuery)); if(!mt&&!mv)return false; }
                return true;
            });
            if(currentSort==='cheap')filtered.sort((a,b)=>a.price-b.price); else if(currentSort==='expensive')filtered.sort((a,b)=>b.price-a.price);
            
            grid.innerHTML = filtered.map(p => {
                let hasV=p.variants&&p.variants.length>0, isLiq=p.category==='liquids';
                let total=hasV?p.variants.reduce((s,v)=>s+v.stock,0):p.stock, oos=total<=0;
                let img=p.img&&p.img.trim()!==""?`<img src="${p.img}" loading="lazy" class="card-img" alt="${p.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><svg class="card-no-img" style="display:none;" viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-2 12H8V8h8v8z"/></svg>`:`<svg class="card-no-img" viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-2 12H8V8h8v8z"/></svg>`;
                
                let vHTML='';
                if(hasV){
                    let force=searchQuery!==''&&p.variants.some(v=>v.name.toLowerCase().includes(searchQuery));
                    let list=p.variants.map(v=>{
                        if(searchQuery!==''&&!p.title.toLowerCase().includes(searchQuery)&&!v.name.toLowerCase().includes(searchQuery))return '';
                        let voos=(v.stock<=0)||oos, cid=`${p.id}_${v.name}`, ci=cart.find(i=>String(i.id)===String(p.id)&&i.variantName===v.name), q=ci?ci.qty:0;
                        let act=voos?`<button class="buy-btn" disabled style="border-color:#666;color:#666;box-shadow:none;cursor:not-allowed;">✖</button>`:(q===0?`<button class="buy-btn" onclick="changeQty('${cid}',1,'${p.id}','${v.name}')">+</button>`:`<div class="qty-control"><button class="qty-btn" onclick="changeQty('${cid}',-1,'${p.id}','${v.name}')">-</button><span class="qty-num">${q}</span><button class="qty-btn" onclick="changeQty('${cid}',1,'${p.id}','${v.name}')">+</button></div>`);
                        return `<div class="variant-item" style="${voos?'opacity:0.6;':''}"><div style="display:flex;align-items:center;flex-grow:1;"><div class="glossy-stock-box" style="${voos?'background:#666;color:#ccc;':''}">${v.stock}</div><div class="variant-name" style="${voos?'text-decoration:line-through;color:#888;':''}">${v.name}</div></div>${act}</div>`;
                    }).join('');
                    let btn=isLiq?"Выбрать вкус":"Выбрать цвет", isOpen=openAccordions[p.id]||force;
                    vHTML=`<button class="choose-flavor-btn" onclick="toggleVariants('${p.id}')" style="${oos?'border-color:#666;color:#666;':''}">${btn}</button><div id="variants-${p.id}" class="variants-container" style="display:${isOpen?'flex':'none'};">${list}</div>`;
                } else {
                    let ci=cart.find(i=>String(i.id)===String(p.id)&&!i.variantName), q=ci?ci.qty:0;
                    vHTML=oos?`<button class="buy-btn" disabled style="border-color:#666;color:#666;box-shadow:none;cursor:not-allowed;">✖</button>`:(q===0?`<button class="buy-btn" onclick="changeQty('${p.id}',1,'${p.id}')">+</button>`:`<div class="qty-control"><button class="qty-btn" onclick="changeQty('${p.id}',-1,'${p.id}')">-</button><span class="qty-num">${q}</span><button class="qty-btn" onclick="changeQty('${p.id}',1,'${p.id}')">+</button></div>`);
                }
                
                let info=oos?`<div class="card-stock" style="color:var(--danger);font-weight:bold;"><div class="stock-dot" style="background:var(--danger);box-shadow:0 0 8px var(--danger);"></div> Нет в наличии</div>`:(hasV?`<div class="card-stock"><div class="stock-dot"></div> В наличии</div>`:`<div class="card-stock"><div class="stock-dot"></div> В наличии (${p.stock})</div>`);
                let ov=oos?`<div style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:1;pointer-events:none;"></div>`:'';
                
                return `<div class="card ${oos?'out-of-stock':''}"><div class="card-img-wrapper">${img}${ov}${p.badge?`<div class="badge" style="z-index:3;">${p.badge}</div>`:''}</div><div class="card-body"><div><div class="card-title">${p.title}</div><div style="font-size:10px;color:var(--primary);margin-bottom:4px;line-height:1.1;">${p.desc}</div>${info}</div><div class="card-footer" style="${hasV?'flex-direction:column;align-items:flex-start;':''}"><div class="price" style="${hasV?'margin-bottom:5px;':''}">${p.price} ₽</div>${vHTML}</div></div></div>`;
            }).join('');
        }

        // === CART ===
        function changeQty(cid,delta,pid,vn){
            let ci=vn?cart.find(i=>String(i.id)===String(pid)&&i.variantName===vn):cart.find(i=>String(i.id)===String(pid)&&!i.variantName);
            const p=products.find(x=>String(x.id)===String(pid)); if(!p)return;
            let cur=vn?(p.variants.find(v=>v.name===vn)?.stock||0):p.stock;
            if(ci){ if(delta>0&&ci.qty>=cur)return; ci.qty+=delta; if(ci.qty<=0)cart=cart.filter(i=>i!==ci); }
            else if(delta>0){ cart.push({id:pid,variantName:vn||null,title:vn?`${p.title} (${vn})`:p.title,price:p.price,qty:1}); }
            if(window.Telegram?.WebApp)window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            saveCart();updateBadge();renderProducts();
        }
        function removeFromCart(i){ cart.splice(i,1); if(window.Telegram?.WebApp)window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy'); saveCart();updateBadge();renderCart();renderProducts(); }
        function saveCart(){ try{localStorage.setItem('legion_cart_cosmic',JSON.stringify(cart));}catch(e){} }
        function updateBadge(){ const t=cart.reduce((s,i)=>s+i.qty,0), b=document.getElementById('cart-badge'); if(t>0){b.style.display='flex';b.innerText=t;}else b.style.display='none'; }

        async function applyPromo() {
            const code=document.getElementById('promoInput').value.trim().toUpperCase(), m=document.getElementById('promoMessage');
            if(!code)return; if(!supabase){m.innerText="База не подключена";m.style.color="var(--danger)";return;}
            m.innerText="Проверка..."; m.style.color="var(--text-muted)";
            try{
                const {data:promo,error}=await supabase.from('promocodes').select('*').eq('code',code).eq('is_active',true).single();
                if(error||!promo){m.innerText="❌ Промокод не найден или отключен";m.style.color="var(--danger)";currentDiscount=0;renderCart();return;}
                const uid=tgUser?.id?.toString()||'guest';
                const {data:used}=await supabase.from('used_promos').select('*').eq('code',code).eq('user_id',uid);
                if(used&&used.length>0){m.innerText="❌ Вы уже использовали этот промокод";m.style.color="var(--danger)";currentDiscount=0;renderCart();return;}
                m.innerText=`✅ Промокод применен! Скидка: ${promo.discount} ₽`;m.style.color="var(--primary)";currentDiscount=promo.discount;renderCart();
            }catch(e){m.innerText="Ошибка проверки: "+e.message;m.style.color="var(--danger)";}
        }

        function renderCart() {
            const c=document.getElementById('cart-items'), e=document.getElementById('cart-empty-state'), btn=document.getElementById('checkout-btn');
            if(cart.length===0){c.innerHTML='';e.style.display='flex';btn.style.display='none';return;}
            e.style.display='none';btn.style.display='flex'; let total=0;
            c.innerHTML=cart.map((it,i)=>{ const cp=products.find(p=>String(p.id)===String(it.id)); if(cp)it.price=cp.price; total+=it.price*it.qty;
                return `<div class="cart-item"><div style="flex-grow:1;"><div style="font-weight:600;font-size:15px;">${it.title}</div><div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${it.qty} шт.</div></div><div style="font-weight:800;font-size:16px;color:var(--primary);text-shadow:0 0 5px var(--primary);margin-right:10px;">${it.price*it.qty} ₽</div><button class="remove-btn" onclick="removeFromCart(${i})">✖</button></div>`; }).join('');
            let f=Math.max(0,total-currentDiscount);
            btn.innerHTML=`<span>Оформить заказ</span> <span>${f} ₽ ${currentDiscount>0?`<span style="font-size:12px;text-decoration:line-through;opacity:0.7;">${total} ₽</span>`:''}</span>`;
        }

        // === NAV & CHECKOUT ===
        function switchTab(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); document.getElementById(`page-${id}`).classList.add('active'); document.getElementById(`nav-${id}`).classList.add('active'); if(id==='cart')renderCart(); }
        
        async function checkout() {
            if(cart.length===0)return; let txt="🛒 Новый заказ из приложения:\n\n", total=0;
            cart.forEach((it,i)=>{ const cp=products.find(p=>String(p.id)===String(it.id)); if(cp)it.price=cp.price; txt+=`${i+1}. ${it.title} — ${it.qty} шт. (${it.price*it.qty} ₽)\n`; total+=it.price*it.qty; });
            let f=Math.max(0,total-currentDiscount); txt+=`\n💰 Итого к оплате: ${f} ₽`; if(currentDiscount>0)txt+=` (Скидка по промокоду: -${currentDiscount} ₽)`;
            if(tgUser){ txt+=`\n\n👤 Заказчик: ${tgUser.first_name} ${tgUser.last_name||''}`; txt+=tgUser.username?` (@${tgUser.username})`:` (ID: ${tgUser.id})`; } else txt+=`\n\n👤 Заказчик: Гость`;
            
            if(currentDiscount>0&&tgUser&&supabase){ const code=document.getElementById('promoInput').value.trim().toUpperCase(); try{await supabase.from('used_promos').insert({user_id:tgUser.id.toString(),code:code});}catch(e){console.log(e);} }
            
            cart=[];currentDiscount=0;document.getElementById('promoInput').value='';document.getElementById('promoMessage').innerText='';
            saveCart();updateBadge();renderProducts();switchTab('catalog');
            const enc=encodeURIComponent(txt);
            if(window.Telegram?.WebApp)window.Telegram.WebApp.openTelegramLink(`https://t.me/managerlegionshop?text=${enc}`); else window.open(`https://t.me/managerlegionshop?text=${enc}`,'_blank');
        }

        setTimeout(async ()=>{ initProfile(); updateBadge(); await loadProducts(); }, 50);
    </script>
</body>
</html>
